name: Arena

# ローカルマシンを熱くせずに戦略同士のアリーナ対局をGitHub Actions上で実行する。
# 起動は次の2通り（通常のコード push では走らない）:
#   1. Actions UI / `gh workflow run` の手動起動（workflow_dispatch）
#   2. `.github/ci/arena.request.json` を含む push（エージェントが gh 無しで回す用）
# 引数は CLAUDE.md の `cargo run --release --bin arena` と同じ体系。
# 「基準 × シャード」の matrix に分割する: 単一基準の200局でも
# shards=4 なら4ランナーに分かれ、壁時計は1/4になる。
# 各ジョブは機械可読サマリー（ARENA_JSON）を出し、aggregate ジョブが合算する。
on:
  workflow_dispatch:
    inputs:
      games:
        description: "対局数（基準ごと・全シャード合計）"
        required: false
        default: "100"
      candidate:
        description: "候補戦略"
        required: false
        default: "estimator"
      baselines:
        description: "基準戦略（スペース区切り。複数でガントレット）"
        required: false
        default: "estimator_v9 estimator_v10 estimator_v11 estimator_v12 estimator_v13 estimator_v14"
      match_seed:
        description: "共通seed（アブレーション比較用。空なら毎局ランダム）"
        required: false
        default: ""
      shards:
        description: "基準ごとの分割数（並列ランナー数）"
        required: false
        default: "4"
      oracle:
        description: "診断用オラクル（nofoul / check_nofoul。候補側の反則を審判が握りつぶして指し直させる上限測定）"
        required: false
        default: ""
      clock:
        description: "フィッシャー時計（初期秒+加算秒。空なら 1000+3。本番相当は 300+3）"
        required: false
        default: ""
      env:
        description: "評価ノブ（スペース区切りの TSUITATE_XXX=値。**両側に効く**。w スイープ用。例: TSUITATE_MATE_RISK_W=3）"
        required: false
        default: ""
      cand_env:
        description: "候補側だけに効かせる評価ノブ（同じ書式。config で渡すのでプロセス env は動かず凍結相手は既定のまま。候補が凍結版のときは使えない）"
        required: false
        default: ""
      pair_with:
        description: "対照にする Arena 実行ID（この run を候補として局ごとにペア集計する。**同じ match_seed / 局数 / shards / 相手 / 時計**で取った run を指すこと）"
        required: false
        default: ""
      games_from_run_id:
        description: "既存 Arena 実行の対局記録を候補として使う（対局はやり直さず集計とペア集計だけ回す）"
        required: false
        default: ""
      balance_manifest:
        description: "issue #40 held-out 採否用: 計測前に commit した validation manifest のリポジトリ内パス。同一 commit の4 run（対照→候補 × v13/v14）を同じ ref への手動起動で作るのに要る"
        required: false
        default: ""
  push:
    paths:
      - ".github/ci/arena.request.json"

jobs:
  plan:
    runs-on: ubuntu-latest
    # contents: write は held-out の claim タグ（取り直しの台帳）を**計測前に**
    # 取得するためだけ（PR #41 レビュー7巡目）
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.split.outputs.skip }}
      baselines: ${{ steps.split.outputs.baselines }}
      shards: ${{ steps.split.outputs.shards }}
      games_by_shard: ${{ steps.split.outputs.games_by_shard }}
      claim: ${{ steps.split.outputs.claim }}
      candidate: ${{ steps.split.outputs.candidate }}
      match_seed: ${{ steps.split.outputs.match_seed }}
      oracle: ${{ steps.split.outputs.oracle }}
      clock: ${{ steps.split.outputs.clock }}
      env: ${{ steps.split.outputs.env }}
      cand_env: ${{ steps.split.outputs.cand_env }}
      pair_with: ${{ steps.split.outputs.pair_with }}
      games_from: ${{ steps.split.outputs.games_from }}
      balance_manifest: ${{ steps.split.outputs.balance_manifest }}
    steps:
      - uses: actions/checkout@v5
      - id: split
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_GAMES: ${{ github.event.inputs.games }}
          IN_CANDIDATE: ${{ github.event.inputs.candidate }}
          IN_BASELINES: ${{ github.event.inputs.baselines }}
          IN_MATCH_SEED: ${{ github.event.inputs.match_seed }}
          IN_SHARDS: ${{ github.event.inputs.shards }}
          IN_ORACLE: ${{ github.event.inputs.oracle }}
          IN_CLOCK: ${{ github.event.inputs.clock }}
          IN_ENV: ${{ github.event.inputs.env }}
          IN_CAND_ENV: ${{ github.event.inputs.cand_env }}
          IN_PAIR_WITH: ${{ github.event.inputs.pair_with }}
          IN_GAMES_FROM: ${{ github.event.inputs.games_from_run_id }}
          IN_BALANCE_MANIFEST: ${{ github.event.inputs.balance_manifest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_baselines='estimator_v9 estimator_v10 estimator_v11 estimator_v12 estimator_v13 estimator_v14'
          req='.github/ci/arena.request.json'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            games="${IN_GAMES:-100}"
            candidate="${IN_CANDIDATE:-estimator}"
            baselines="${IN_BASELINES:-$default_baselines}"
            match_seed="${IN_MATCH_SEED:-}"
            shards="${IN_SHARDS:-4}"
            oracle="${IN_ORACLE:-}"
            clock="${IN_CLOCK:-}"
            extra_env="${IN_ENV:-}"
            cand_env="${IN_CAND_ENV:-}"
            pair_with="${IN_PAIR_WITH:-}"
            games_from="${IN_GAMES_FROM:-}"
            # held-out 採否の4 run（対照→候補 × v13/v14）は**同一 commit** が
            # 必須（合算器が要求する）なので、request ファイルの書き換え push では
            # 作れない（push のたびに commit が変わる）。同じ ref への手動起動
            # 4回でここから manifest を渡す（PR #41 レビュー5巡目）
            balance_manifest="${IN_BALANCE_MANIFEST:-}"
          else
            if [ ! -f "$req" ]; then
              # push の paths フィルタはファイルの削除にも一致するので、計測が
              # 終わって $req を消す commit でもこのワークフローが起動する。
              # 異常ではなく後片付けの正常系なので、赤い run を残さず全ジョブを
              # スキップする（後続は if: needs.plan.outputs.skip != 'true'）。
              echo "リクエストファイルが削除された push（後片付け）なので何もしない"
              {
                echo "skip=true"
                # 後続ジョブは if: で止まるが、matrix の fromJSON が空文字で
                # 落ちないよう妥当な形の既定値も置いておく（値は使われない）
                echo "baselines=[\"dummy\"]"
                echo "shards=[0]"
                echo "games_by_shard=[0]"
                echo "claim="
                echo "candidate=estimator"
                echo "match_seed="
                echo "oracle="
                echo "clock="
                echo "env="
                echo "cand_env="
                echo "pair_with="
                echo "games_from="
                echo "balance_manifest="
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            games=$(jq -r '.games // 100' "$req")
            candidate=$(jq -r '.candidate // "estimator"' "$req")
            baselines=$(jq -r '
              if (.baselines | type) == "array" then .baselines | join(" ")
              else .baselines // ""
              end
            ' "$req")
            [ -n "$baselines" ] || baselines="$default_baselines"
            match_seed=$(jq -r '.match_seed // ""' "$req")
            shards=$(jq -r '.shards // 4' "$req")
            oracle=$(jq -r '.oracle // ""' "$req")
            clock=$(jq -r '.clock // ""' "$req")
            extra_env=$(jq -r '.env // ""' "$req")
            cand_env=$(jq -r '.cand_env // ""' "$req")
            pair_with=$(jq -r '.pair_with // ""' "$req")
            games_from=$(jq -r '.games_from_run_id // ""' "$req")
            balance_manifest=$(jq -r '.balance_manifest // ""' "$req")
          fi
          # ペア集計は局ごとの突き合わせなので、match_seed が無いと成立しない
          # （`games_from` の再集計では元 run が match_seed 付きで回っていればよい）
          if [ -n "$pair_with" ] && [ -z "$match_seed" ] && [ -z "$games_from" ]; then
            echo "pair_with は match_seed と併用してください（局ごとの条件が揃いません）" >&2
            exit 1
          fi
          # **held-out 採否 run（balance_manifest あり）の plan 検査**（PR #41
          # レビュー6巡目）: ①事前登録の実験条件（games / shards / seed /
          # candidate）が manifest と一致 ②**取り直しの台帳**（成功 run が
          # 押した claim タグが既にあれば、同じ (manifest, arm, 相手) の
          # 再計測 = 事前登録違反として起動を拒否。infra 失敗で claim が
          # 押されなかった run はやり直せる）。台帳は永続の git タグなので
          # 事後の監査もできる
          claim=""
          if [ -n "${balance_manifest:-}" ]; then
            if [ ! -f "$balance_manifest" ]; then
              echo "balance_manifest が見つかりません: $balance_manifest" >&2; exit 1
            fi
            for key in games shards candidate; do
              want=$(jq -r ".${key} // empty" "$balance_manifest")
              got=$(eval "echo \"\$${key}\"")
              if [ -z "$want" ] || [ "$want" != "$got" ]; then
                echo "held-out run の ${key}=${got} が manifest の ${want:-（無し）} と一致しません" >&2
                exit 1
              fi
            done
            if [ "$(echo "$baselines" | wc -w)" -ne 1 ]; then
              echo "held-out run は1相手ずつ起動します（baselines=$baselines）" >&2; exit 1
            fi
            want_seed=$(jq -r ".opponents[\"$baselines\"] // empty" "$balance_manifest")
            if [ -z "$want_seed" ] || [ "$want_seed" != "$match_seed" ]; then
              echo "held-out run の match_seed=$match_seed が manifest の opponents[$baselines]=${want_seed:-（無し）} と一致しません" >&2
              exit 1
            fi
            # **claim を取る前に「合算器へ渡せる run か」を固定する**（PR #41
            # レビュー7巡目 [P1]: 判定不能になる run が claim を消費すると、
            # 正しい再実行が永久に拒否される）。oracle / 両側 env / 時計変更 /
            # re-run は判定不能・die の対象なので起動自体を拒否し、cand arm は
            # pair_with 必須（ctrl arm は禁止）・cand_env は manifest と完全一致
            if [ -n "$oracle" ]; then
              echo "held-out run に oracle は使えません（合算器が die する）" >&2; exit 1
            fi
            if [ -n "$extra_env" ]; then
              echo "held-out run に env（両側ノブ）は使えません（判定不能になる）" >&2; exit 1
            fi
            if [ -n "$clock" ]; then
              echo "held-out run の時計は既定（1000+3）のまま起動してください" >&2; exit 1
            fi
            if [ -n "$cand_env" ]; then
              arm=cand
              if [ -z "$pair_with" ]; then
                echo "候補 run は pair_with（対照 run の ID）が必須です（無い記録は判定不能）" >&2; exit 1
              fi
              want_knobs=$(jq -r '.cand_knobs | to_entries | map("\(.key)=\(.value)") | sort | join(" ")' "$balance_manifest")
              got_knobs=$(printf '%s\n' $cand_env | sort | paste -sd' ' -)
              if [ "$got_knobs" != "$want_knobs" ]; then
                echo "cand_env [$got_knobs] が manifest の cand_knobs [$want_knobs] と一致しません" >&2; exit 1
              fi
            else
              arm=ctrl
              if [ -n "$pair_with" ]; then
                echo "対照 run に pair_with は付けません（候補 run が対照を指す向きだけ）" >&2; exit 1
              fi
            fi
            fp=$(sha256sum "$balance_manifest" | cut -c1-16)
            claim="balance-claim/${fp}/${arm}-${baselines}"
            if git ls-remote --exit-code origin "refs/tags/$claim" >/dev/null 2>&1; then
              echo "この (manifest, ${arm}, ${baselines}) の run は既にあります（tag $claim）。" >&2
              echo "同じ実験の取り直しは事前登録違反です。別の実験なら新しい manifest を commit してください" >&2
              exit 1
            fi
            # **claim は計測前にここで取得する**（PR #41 レビュー7巡目 [P1]:
            # 成功後に押す方式は、同時 dispatch の両方が完走して artifact を
            # 残し、未claim側を後から選べた）。annotated tag の message に
            # run_id / attempt を残す = どの実行が slot を取ったかの不変記録。
            # 同時 dispatch は ref 作成の 422 で後着の plan が落ち、対局は始まらない。
            # 対局が完走しなかった run は release-claim ジョブが解放する
            tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="$claim" -f type=commit -f object="${GITHUB_SHA}" \
              -f message="{\"run_id\":\"${GITHUB_RUN_ID}\",\"run_attempt\":${GITHUB_RUN_ATTEMPT},\"arm\":\"${arm}\",\"baseline\":\"${baselines}\"}" \
              --jq .sha)
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$claim" -f sha="$tag_sha"
            echo "claim 取得: $claim（run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}）"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "起動: event=$EVENT_NAME games=$games candidate=$candidate baselines=$baselines shards=$shards match_seed=$match_seed clock=$clock env=$extra_env cand_env=$cand_env"
          echo "baselines=$(echo "$baselines" | jq -R -c 'split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -n -c "[range(0; ${shards})]")" >> "$GITHUB_OUTPUT"
          # **シャード分割は合計が正確に games になる偶数割り**（PR #41 レビュー
          # 6巡目 [P1]。従来の ceil の偶数化は 600/8 を 608局 に膨らませ、
          # 600ペアちょうどを要求する合算器と両立しなかった）。分割規約と
          # 既知ケースは scripts/ci/split_arena_games.py（--self-test を先に回す）
          python3 scripts/ci/split_arena_games.py --self-test
          games_by_shard=$(python3 scripts/ci/split_arena_games.py "$games" "$shards")
          echo "分割: $games_by_shard（合計 $games）"
          echo "games_by_shard=$games_by_shard" >> "$GITHUB_OUTPUT"
          echo "claim=$claim" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "match_seed=$match_seed" >> "$GITHUB_OUTPUT"
          echo "oracle=$oracle" >> "$GITHUB_OUTPUT"
          echo "clock=$clock" >> "$GITHUB_OUTPUT"
          {
            echo "games_from=$games_from"
            echo "pair_with=$pair_with"
            echo "balance_manifest=${balance_manifest:-}"
            echo "cand_env=$cand_env"
            echo "env<<EOF"
            echo "$extra_env"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  arena:
    needs: plan
    # `games_from_run_id` の再集計では対局をやり直さない
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.games_from == ''
    strategy:
      fail-fast: false
      matrix:
        baseline: ${{ fromJSON(needs.plan.outputs.baselines) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run arena shard
        env:
          # 候補(A)視点の対局記録。bin/analyze での敗着分析用に artifact で回収する
          # （オラクル有効時は selfplay 側が記録を自動で無効化する）
          ARENA_RECORD_DIR: arena-records
          ARENA_JSON: arena-summary.json
          # **1行=1対局**の結果（issue #19 の P0: 同じ match_seed の2本を局ごとに
          # 突き合わせて Var(ペア差) を実測する）。match_seed 未指定の run では
          # 対局条件が揃わないので arena 側が書かずに理由を出す
          ARENA_GAMES_JSON: arena-games.jsonl
          ARENA_ORACLE_A: ${{ needs.plan.outputs.oracle }}
          # 評価項の発火率（src/hits.rs）。中立だった変更が「効いていない」のか
          # 「そもそも発火していない」のかを切り分けるため常時集計する
          # （実測で思考時間への影響なし）
          TSUITATE_DBG_HITS: "1"
          ARENA_EXTRA_ENV: ${{ needs.plan.outputs.env }}
          ARENA_CAND_ENV: ${{ needs.plan.outputs.cand_env }}
          ARENA_CLOCK: ${{ needs.plan.outputs.clock }}
          # 候補 run が対照に指した run（arena-balance が対照の取り違え検査に使う）。
          # 実行の識別子そのもの（run_id / run_attempt）は Actions の既定 env
          # GITHUB_RUN_ID / GITHUB_RUN_ATTEMPT から bin/arena が自分で読む
          ARENA_PAIR_WITH: ${{ needs.plan.outputs.pair_with }}
          # 計測前に commit した validation manifest（issue #40 の held-out 採否用）。
          # 指定すると games.jsonl の全行へ sha256 が焼き込まれ、arena-balance
          # --manifest がその一致を要求する
          ARENA_BALANCE_MANIFEST: ${{ needs.plan.outputs.balance_manifest }}
        run: |
          set -euo pipefail
          # held-out（manifest-bound）run の re-run attempt は使えない: 記録の
          # run_attempt が 1 でなくなり合算器が判定不能にする。ここで止めれば
          # attempt 1 の失敗時に release-claim が claim を解放済みなので、
          # 新しい run として取り直せる（PR #41 レビュー7巡目）
          if [ -n "${ARENA_BALANCE_MANIFEST:-}" ] && [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "held-out run は re-run せず、新しい run として起動し直してください" >&2
            exit 1
          fi
          # 共通seed指定時はシャードごとにずらす（シャード間の対局重複を防ぎつつ、
          # 同じ入力なら版をまたいで同じ対局条件列になる）
          seed='${{ needs.plan.outputs.match_seed }}'
          if [ -n "$seed" ]; then
            # **Bash の `$(( ))` は符号付き 64-bit** なので、seed の型（`u64`）の
            # 上半分で折り返す（PR #35 レビュー5巡目 [P2]。実測: base
            # 18446744073709551612 が shard 1 で `-3` になり、`bin/arena` の
            # `env_u64` が「非負整数でない」として run を止める）。producer /
            # checker / テストの3者が同じ `u64` 全域を扱えるように、加算は
            # 任意精度＋範囲検査へ寄せる。**素の代入で受ける**こと:
            # `export VAR=$(...)` は export の終了状態になるので失敗を握り潰す
            ms=$(python3 scripts/ci/verify_seed_provenance.py \
                   --shard-seed "$seed" '${{ matrix.shard }}')
            export ARENA_MATCH_SEED="$ms"
            # **ずらす前の base と shard 番号も渡す**（PR #35 レビュー2巡目 [P1]）。
            # 記録に残る match_seed は「base + shard」をさらに基準ごとに XOR した
            # 実効値なので、下流の診断はこれが無いと「どの base seed で回した run か」を
            # 式の複製なしには照合できない
            export ARENA_MATCH_SEED_BASE="$seed"
            export ARENA_SHARD='${{ matrix.shard }}'
          fi
          # 時計（審判側の設定なので ARENA_*。両者に等しく効く）
          if [ -n "$ARENA_CLOCK" ]; then
            case "$ARENA_CLOCK" in
              [0-9]*+[0-9]*)
                export ARENA_FISCHER_INITIAL_MS=$(( ${ARENA_CLOCK%%+*} * 1000 ))
                export ARENA_FISCHER_INCREMENT_MS=$(( ${ARENA_CLOCK##*+} * 1000 ))
                ;;
              *) echo "無視（初期秒+加算秒 の形式のみ）: ${ARENA_CLOCK}" ;;
            esac
          fi
          # 評価ノブ（TSUITATE_* のみ許可）。
          # 注意: env はプロセス全体に効き、凍結版も凍結時点で読んでいた env を読む
          # （TSUITATE_THINK_BUDGET_MS は v6〜v11 全部、VALUE_NN_W 等は v11。
          # 一覧は frozen::env_keys_in_source で取れる）。
          # **候補側だけに効かせたいときは cand_env（= ARENA_CAND_KNOBS）**:
          # 値はプロセス env でなく StrategyConfig として候補 instance にだけ渡るので、
          # env を読み続ける凍結相手は必ず既定値のまま動く（issue #21）
          for kv in $ARENA_EXTRA_ENV; do
            case "$kv" in
              TSUITATE_*=*) export "$kv" ;;
              *) echo "無視（TSUITATE_XXX=値 のみ許可）: ${kv}" ;;
            esac
          done
          export ARENA_CAND_KNOBS="$ARENA_CAND_ENV"
          cargo run --release --bin arena -- \
            "${{ fromJSON(needs.plan.outputs.games_by_shard)[matrix.shard] }}" \
            "${{ needs.plan.outputs.candidate }}" \
            "${{ matrix.baseline }}" \
            | tee arena-result.txt

      # 被詰めろオラクル: 相手が詰みを実行してこない環境でも自玉の受けを測れる
      # 唯一の指標なので、記録を捨てる前にこのジョブで集計してサマリーへ出す。
      # issue #28 の詰み経済セクション（終局の攻め／受け・手数調整した露出・
      # 詰め手の排他的分類・受けの漏斗・列挙コスト）もここから拾う。
      # **行を足したらこのフィルタも直す**（check-economy.yml のフィルタも同じ
      # 行を拾うので両方直すこと。analyze の出力は局ごとの明細が
      # 大半なので、集計行だけを列挙で拾う方式にしてある）
      - name: Analyze records (詰み経済・被詰めろオラクル)
        if: always()
        run: |
          if ls arena-records/*.jsonl > /dev/null 2>&1; then
            cargo run --release --bin analyze -- arena-records/*.jsonl \
              | grep -E "^(被詰めろ:|1手詰みの存在|只取られ|反則の原因|終局:|--- 詰み経済|mate_moves_in_1_fast|  +[0-9]+回|  (露出|初回被詰めろ|エピソード長|詰め手の排他的分類|受けの漏斗|被詰めろ手番|全決定点|終盤（|完全版)|--- 王手中の反則経済|王手中の手番:|  型 |  最初の反則の着手先|  反則した手番の開始時|  そのうちソルバー最善|  受理された非玉手|  王手駒仮説|  反則した王手手番の開始時|  p_legal 較正|  捕獲試みの方向つき|  ソルバー方策の破滅|  \*\*整合性検査|--- 被王手の前の準備|  玉の手で王手を解消した手番|  \(a\) |  \(b\) |  \(c\) |  人間の王手|  bot の王手|  寄与量|    (真の王手駒の仮説|反則の原因（真実|玉の手|捕獲試み|移動合駒|打ち))" \
              > analyze-summary.txt || true
            cat analyze-summary.txt
          fi

      - name: Write job summary
        if: always()
        run: |
          {
            echo '```'
            cat arena-result.txt
            if [ -s analyze-summary.txt ]; then
              echo ""
              cat analyze-summary.txt
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arena-result-${{ matrix.baseline }}-s${{ matrix.shard }}
          path: |
            arena-result.txt
            arena-summary.json
            arena-games.jsonl
            analyze-summary.txt

      - name: Upload game records
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arena-records-${{ matrix.baseline }}-s${{ matrix.shard }}
          path: arena-records/
          if-no-files-found: ignore

  aggregate:
    needs: [plan, arena]
    # always() は skip した arena も待って走るので、skip 条件を明示しないと
    # 「artifact が1つもありません」で赤くなる。plan 自体が落ちたとき
    # （リクエスト JSON が壊れている等）も同じメッセージで二重に赤くなり
    # 原因を見誤るので、plan の成功も条件に入れる。always() は
    # 「一部シャードが失敗しても残りを合算する」ために残す。
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # actions: read は pair_with / games_from の cross-run artifact ダウンロード用
    # （claim タグは plan が計測前に取得するので、ここに write は要らない）
    permissions:
      contents: read
      actions: read
    steps:
      # **checkout は必ず download より前**。actions/checkout はワークスペースを
      # 掃除するので、後ろに置くと落とした artifact も集計の中間ファイルも消える
      # （2026-08-24 に arena-var のペア集計がこれで落ちた）
      - uses: actions/checkout@v5
        if: needs.plan.outputs.pair_with != ''
      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.games_from == ''
        with:
          pattern: arena-result-*
          path: shards
      # 再集計（`games_from_run_id`）: 対局はやり直さず、過去の run の
      # シャード結果から集計とペア集計だけ回す
      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.games_from != ''
        with:
          pattern: arena-result-*
          path: shards
          run-id: ${{ needs.plan.outputs.games_from }}
          github-token: ${{ github.token }}

      - name: Aggregate shards
        run: |
          # download-artifact は v5 以降、pattern の一致が1件だけだと
          # artifact 名のサブディレクトリを作らず path 直下へ展開する
          # （基準1つ × shards=1 のとき）。両方の配置を拾うため ** で辿る。
          shopt -s nullglob globstar
          parts=(shards/**/arena-summary.json)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "arena-result-* の artifact が1つもありません（全シャードが失敗？）" >&2
            exit 1
          fi
          cat "${parts[@]}" > all.jsonl
          # 1行=1対局の記録も1本にまとめる（arena-var のペア集計の入力。
          # match_seed 未指定の run では arena が書かないので空でよい）
          games=(shards/**/arena-games.jsonl)
          if [ ${#games[@]} -gt 0 ]; then
            cat "${games[@]}" > all-games.jsonl
            echo "1行=1対局の記録: $(wc -l < all-games.jsonl) 局（arena-var 用）"
          fi
          jq -s '
            group_by(.baseline) | map(
              (map(.wins_a) | add) as $w |
              (map(.wins_b) | add) as $l |
              ($w + $l) as $dec |
              {
                baseline: .[0].baseline,
                candidate: .[0].candidate,
                games: (map(.games) | add),
                wins: $w,
                losses: $l,
                draws: (map(.draws) | add),
                checkmate: (map(.checkmate) | add),
                foul_limit: (map(.foul_limit) | add),
                timeout: (map(.timeout) | add),
                max_plies: (map(.max_plies) | add),
                avg_plies: ((map(.total_plies) | add) / (map(.games) | add)),
                fouls_a_per_game: ((map(.fouls_a) | add) / (map(.games) | add)),
                fouls_b_per_game: ((map(.fouls_b) | add) / (map(.games) | add)),
                think_avg_ms_a: ((map(.think_avg_ms_a * .games) | add) / (map(.games) | add)),
                think_p99_ms_a_max: (map(.think_p99_ms_a) | max),
                clock_used_pct_a: (
                  (map(.clock_granted_ms_a // 0) | add) as $g |
                  if $g > 0 then (map(.clock_used_ms_a // 0) | add) / $g * 100 else 0 end
                ),
                clock_min_s_a: ((map(.clock_min_ms_a // empty) | min // 0) / 1000),
              } + (
                if $dec > 0 then
                  ($w / $dec) as $rate |
                  { rate_pct: ($rate * 100),
                    ci_pct: (1.96 * (($rate * (1 - $rate) / $dec) | sqrt) * 100) }
                else
                  { rate_pct: 50, ci_pct: 0 }
                end
              )
            )
          ' all.jsonl > combined.json
          {
            echo "## 総合（全シャード合算・candidate=${{ needs.plan.outputs.candidate }}・時計 ${{ needs.plan.outputs.clock || '1000+3' }}・env '${{ needs.plan.outputs.env }}'）"
            echo ""
            echo '| 基準 | 勝率 | 勝-負-分 | 詰み | 反則負け | 時間切れ | 手数上限 | 平均手数 | 反則/局(A) | think avg/p99max (A) | クロック消費(A) | 残り最小(A) |'
            echo '|---|---|---|---|---|---|---|---|---|---|---|---|'
            jq -r '.[] | "| \(.baseline) | \(.rate_pct | . * 10 | round / 10)% ± \(.ci_pct | . * 10 | round / 10)% | \(.wins)-\(.losses)-\(.draws) | \(.checkmate) | \(.foul_limit) | \(.timeout) | \(.max_plies) | \(.avg_plies | . * 10 | round / 10) | \(.fouls_a_per_game | . * 100 | round / 100) | \(.think_avg_ms_a | round)ms / \(.think_p99_ms_a_max | round)ms | \(.clock_used_pct_a | . * 10 | round / 10)% | \(.clock_min_s_a | . * 10 | round / 10)s |"' combined.json
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      # --- 局ごとのペア集計（issue #19 の P0）---------------------------------
      # 対照の run を `pair_with` で指すと、この run を候補として
      #   delta = 候補のスコア − 対照のスコア   （同じ match_seed の同じ局）
      # を局ごとに取り、**Var(ペア差)** と既知 arena 差を出す。
      # checkpoint arena の var·CPU秒 は、この実測が無いと Var=0.5 の仮定に乗る。
      - name: Download control run games
        if: needs.plan.outputs.pair_with != ''
        uses: actions/download-artifact@v7
        with:
          name: arena-combined
          path: control-run
          run-id: ${{ needs.plan.outputs.pair_with }}
          github-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@stable
        if: needs.plan.outputs.pair_with != ''
      - uses: Swatinem/rust-cache@v2
        if: needs.plan.outputs.pair_with != ''
      - name: Pair with control run
        if: needs.plan.outputs.pair_with != ''
        run: |
          set -euo pipefail
          if [ ! -s control-run/all-games.jsonl ]; then
            echo "::error::対照 run ${{ needs.plan.outputs.pair_with }} に all-games.jsonl がありません（match_seed 無しで回した run か、この機能より前の run です）"
            exit 1
          fi
          cargo run --release --bin checkpoint_arena -- arena-var \
            --control control-run/all-games.jsonl \
            --candidate all-games.jsonl \
            --label "run${{ github.run_id }}-vs-${{ needs.plan.outputs.pair_with }}" \
            --markdown arena-var.md --json arena-var.json
          cat arena-var.md >> "$GITHUB_STEP_SUMMARY"
          cat arena-var.md

      - name: Upload combined result
        uses: actions/upload-artifact@v6
        with:
          name: arena-combined
          path: |
            combined.json
            all.jsonl
            all-games.jsonl
            arena-var.md
            arena-var.json

  # **held-out の claim の解放**（PR #41 レビュー7巡目）。claim は plan が
  # **計測前に**取得している（同時 dispatch の後着は plan で落ちる = 未claim の
  # 完走 artifact が生まれない）ので、ここでは「対局が完走しなかった run」の
  # claim だけを解放して新しい run での取り直しを可能にする。
  # **aggregate の失敗では解放しない**（対局 = 計測は存在しているので、
  # そこからのやり直しは「成功した計測の取り直し」になる）。
  # re-run attempt からも解放しない（attempt 1 の失敗時に解放済みのはずで、
  # 成功済み run の re-run で claim を消す経路を塞ぐ）
  release-claim:
    needs: [plan, arena]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.claim != '' && needs.arena.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "re-run attempt からは解放しない（失敗した run は re-run せず新しい run を起動する）"
            exit 0
          fi
          claim='${{ needs.plan.outputs.claim }}'
          # 念のため: この run が取得した claim であることを message の記録で
          # 確かめてから消す（別 run の claim を巻き添えにしない）
          tag_obj=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$claim" --jq .object.sha)
          owner_run=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$tag_obj" --jq .message | jq -r '.run_id' 2>/dev/null || echo "")
          if [ "$owner_run" != "${GITHUB_RUN_ID}" ]; then
            echo "claim $claim は run ${owner_run:-不明} の取得。解放しない"
            exit 0
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$claim"
          echo "released: $claim（対局が完走しなかったため。新しい run として取り直せる）"
