name: Arena

# ローカルマシンを熱くせずに戦略同士のアリーナ対局をGitHub Actions上で実行する。
# 起動は次の2通り（通常のコード push では走らない）:
#   1. Actions UI / `gh workflow run` の手動起動（workflow_dispatch）
#   2. `.github/ci/arena.request.json` を含む push（エージェントが gh 無しで回す用）
# 引数は CLAUDE.md の `cargo run --release --bin arena` と同じ体系。
# 「基準 × シャード」の matrix に分割する: 単一基準の200局でも
# shards=4 なら4ランナーに分かれ、壁時計は1/4になる。
# 各ジョブは機械可読サマリー（ARENA_JSON）を出し、aggregate ジョブが合算する。
on:
  workflow_dispatch:
    inputs:
      games:
        description: "対局数（基準ごと・全シャード合計）"
        required: false
        default: "100"
      candidate:
        description: "候補戦略"
        required: false
        default: "estimator"
      baselines:
        description: "基準戦略（スペース区切り。複数でガントレット）"
        required: false
        default: "estimator_v9 estimator_v10 estimator_v11 estimator_v12 estimator_v13 estimator_v14"
      match_seed:
        description: "共通seed（アブレーション比較用。空なら毎局ランダム）"
        required: false
        default: ""
      shards:
        description: "基準ごとの分割数（並列ランナー数）"
        required: false
        default: "4"
      oracle:
        description: "診断用オラクル（nofoul / check_nofoul。候補側の反則を審判が握りつぶして指し直させる上限測定）"
        required: false
        default: ""
      clock:
        description: "フィッシャー時計（初期秒+加算秒。空なら 1000+3。本番相当は 300+3）"
        required: false
        default: ""
      env:
        description: "評価ノブ（スペース区切りの TSUITATE_XXX=値。w スイープ用。例: TSUITATE_MATE_RISK_W=3。思考予算は TSUITATE_CAND_THINK_BUDGET_MS を使うこと）"
        required: false
        default: ""
  push:
    paths:
      - ".github/ci/arena.request.json"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      baselines: ${{ steps.split.outputs.baselines }}
      shards: ${{ steps.split.outputs.shards }}
      games_per_shard: ${{ steps.split.outputs.games_per_shard }}
      candidate: ${{ steps.split.outputs.candidate }}
      match_seed: ${{ steps.split.outputs.match_seed }}
      oracle: ${{ steps.split.outputs.oracle }}
      clock: ${{ steps.split.outputs.clock }}
      env: ${{ steps.split.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_GAMES: ${{ github.event.inputs.games }}
          IN_CANDIDATE: ${{ github.event.inputs.candidate }}
          IN_BASELINES: ${{ github.event.inputs.baselines }}
          IN_MATCH_SEED: ${{ github.event.inputs.match_seed }}
          IN_SHARDS: ${{ github.event.inputs.shards }}
          IN_ORACLE: ${{ github.event.inputs.oracle }}
          IN_CLOCK: ${{ github.event.inputs.clock }}
          IN_ENV: ${{ github.event.inputs.env }}
        run: |
          set -euo pipefail
          default_baselines='estimator_v9 estimator_v10 estimator_v11 estimator_v12 estimator_v13 estimator_v14'
          req='.github/ci/arena.request.json'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            games="${IN_GAMES:-100}"
            candidate="${IN_CANDIDATE:-estimator}"
            baselines="${IN_BASELINES:-$default_baselines}"
            match_seed="${IN_MATCH_SEED:-}"
            shards="${IN_SHARDS:-4}"
            oracle="${IN_ORACLE:-}"
            clock="${IN_CLOCK:-}"
            extra_env="${IN_ENV:-}"
          else
            if [ ! -f "$req" ]; then
              echo "push 起動なのに $req が無い" >&2
              exit 1
            fi
            games=$(jq -r '.games // 100' "$req")
            candidate=$(jq -r '.candidate // "estimator"' "$req")
            baselines=$(jq -r '
              if (.baselines | type) == "array" then .baselines | join(" ")
              else .baselines // ""
              end
            ' "$req")
            [ -n "$baselines" ] || baselines="$default_baselines"
            match_seed=$(jq -r '.match_seed // ""' "$req")
            shards=$(jq -r '.shards // 4' "$req")
            oracle=$(jq -r '.oracle // ""' "$req")
            clock=$(jq -r '.clock // ""' "$req")
            extra_env=$(jq -r '.env // ""' "$req")
          fi
          echo "起動: event=$EVENT_NAME games=$games candidate=$candidate baselines=$baselines shards=$shards match_seed=$match_seed clock=$clock env=$extra_env"
          echo "baselines=$(echo "$baselines" | jq -R -c 'split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -n -c "[range(0; ${shards})]")" >> "$GITHUB_OUTPUT"
          per=$(( (games + shards - 1) / shards ))
          per=$(( per + per % 2 ))   # 先後を揃えるため偶数化
          echo "games_per_shard=$per" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "match_seed=$match_seed" >> "$GITHUB_OUTPUT"
          echo "oracle=$oracle" >> "$GITHUB_OUTPUT"
          echo "clock=$clock" >> "$GITHUB_OUTPUT"
          {
            echo "env<<EOF"
            echo "$extra_env"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  arena:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        baseline: ${{ fromJSON(needs.plan.outputs.baselines) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run arena shard
        env:
          # 候補(A)視点の対局記録。bin/analyze での敗着分析用に artifact で回収する
          # （オラクル有効時は selfplay 側が記録を自動で無効化する）
          ARENA_RECORD_DIR: arena-records
          ARENA_JSON: arena-summary.json
          ARENA_ORACLE_A: ${{ needs.plan.outputs.oracle }}
          # 評価項の発火率（src/hits.rs）。中立だった変更が「効いていない」のか
          # 「そもそも発火していない」のかを切り分けるため常時集計する
          # （実測で思考時間への影響なし）
          TSUITATE_DBG_HITS: "1"
          ARENA_EXTRA_ENV: ${{ needs.plan.outputs.env }}
          ARENA_CLOCK: ${{ needs.plan.outputs.clock }}
        run: |
          # 共通seed指定時はシャードごとにずらす（シャード間の対局重複を防ぎつつ、
          # 同じ入力なら版をまたいで同じ対局条件列になる）
          seed='${{ needs.plan.outputs.match_seed }}'
          if [ -n "$seed" ]; then
            export ARENA_MATCH_SEED=$(( seed + ${{ matrix.shard }} ))
          fi
          # 時計（審判側の設定なので ARENA_*。両者に等しく効く）
          if [ -n "$ARENA_CLOCK" ]; then
            case "$ARENA_CLOCK" in
              [0-9]*+[0-9]*)
                export ARENA_FISCHER_INITIAL_MS=$(( ${ARENA_CLOCK%%+*} * 1000 ))
                export ARENA_FISCHER_INCREMENT_MS=$(( ${ARENA_CLOCK##*+} * 1000 ))
                ;;
              *) echo "無視（初期秒+加算秒 の形式のみ）: ${ARENA_CLOCK}" ;;
            esac
          fi
          # 評価ノブ（TSUITATE_* のみ許可）。
          # 注意: env はプロセス全体に効き、凍結版も凍結時点で読んでいた env を読む
          # （TSUITATE_THINK_BUDGET_MS は v6〜v11 全部、VALUE_NN_W 等は v11）。
          # 候補側だけ予算を変えるには TSUITATE_CAND_THINK_BUDGET_MS を使う
          for kv in $ARENA_EXTRA_ENV; do
            case "$kv" in
              TSUITATE_*=*) export "$kv" ;;
              *) echo "無視（TSUITATE_XXX=値 のみ許可）: ${kv}" ;;
            esac
          done
          cargo run --release --bin arena -- \
            "${{ needs.plan.outputs.games_per_shard }}" \
            "${{ needs.plan.outputs.candidate }}" \
            "${{ matrix.baseline }}" \
            | tee arena-result.txt

      # 被詰めろオラクル: 相手が詰みを実行してこない環境でも自玉の受けを測れる
      # 唯一の指標なので、記録を捨てる前にこのジョブで集計してサマリーへ出す
      - name: Analyze records (被詰めろオラクル)
        if: always()
        run: |
          if ls arena-records/*.jsonl > /dev/null 2>&1; then
            cargo run --release --bin analyze -- arena-records/*.jsonl \
              | grep -E "^(被詰めろ|1手詰みの存在|只取られ|反則の原因|  +[0-9]+回)" \
              > analyze-summary.txt || true
            cat analyze-summary.txt
          fi

      - name: Write job summary
        if: always()
        run: |
          {
            echo '```'
            cat arena-result.txt
            if [ -s analyze-summary.txt ]; then
              echo ""
              cat analyze-summary.txt
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-result-${{ matrix.baseline }}-s${{ matrix.shard }}
          path: |
            arena-result.txt
            arena-summary.json
            analyze-summary.txt

      - name: Upload game records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-records-${{ matrix.baseline }}-s${{ matrix.shard }}
          path: arena-records/
          if-no-files-found: ignore

  aggregate:
    needs: [plan, arena]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: arena-result-*
          path: shards

      - name: Aggregate shards
        run: |
          cat shards/*/arena-summary.json > all.jsonl
          jq -s '
            group_by(.baseline) | map(
              (map(.wins_a) | add) as $w |
              (map(.wins_b) | add) as $l |
              ($w + $l) as $dec |
              {
                baseline: .[0].baseline,
                candidate: .[0].candidate,
                games: (map(.games) | add),
                wins: $w,
                losses: $l,
                draws: (map(.draws) | add),
                checkmate: (map(.checkmate) | add),
                foul_limit: (map(.foul_limit) | add),
                timeout: (map(.timeout) | add),
                max_plies: (map(.max_plies) | add),
                avg_plies: ((map(.total_plies) | add) / (map(.games) | add)),
                fouls_a_per_game: ((map(.fouls_a) | add) / (map(.games) | add)),
                fouls_b_per_game: ((map(.fouls_b) | add) / (map(.games) | add)),
                think_avg_ms_a: ((map(.think_avg_ms_a * .games) | add) / (map(.games) | add)),
                think_p99_ms_a_max: (map(.think_p99_ms_a) | max),
                clock_used_pct_a: (
                  (map(.clock_granted_ms_a // 0) | add) as $g |
                  if $g > 0 then (map(.clock_used_ms_a // 0) | add) / $g * 100 else 0 end
                ),
                clock_min_s_a: ((map(.clock_min_ms_a // empty) | min // 0) / 1000),
              } + (
                if $dec > 0 then
                  ($w / $dec) as $rate |
                  { rate_pct: ($rate * 100),
                    ci_pct: (1.96 * (($rate * (1 - $rate) / $dec) | sqrt) * 100) }
                else
                  { rate_pct: 50, ci_pct: 0 }
                end
              )
            )
          ' all.jsonl > combined.json
          {
            echo "## 総合（全シャード合算・candidate=${{ needs.plan.outputs.candidate }}・時計 ${{ needs.plan.outputs.clock || '1000+3' }}・env '${{ needs.plan.outputs.env }}'）"
            echo ""
            echo '| 基準 | 勝率 | 勝-負-分 | 詰み | 反則負け | 時間切れ | 手数上限 | 平均手数 | 反則/局(A) | think avg/p99max (A) | クロック消費(A) | 残り最小(A) |'
            echo '|---|---|---|---|---|---|---|---|---|---|---|---|'
            jq -r '.[] | "| \(.baseline) | \(.rate_pct | . * 10 | round / 10)% ± \(.ci_pct | . * 10 | round / 10)% | \(.wins)-\(.losses)-\(.draws) | \(.checkmate) | \(.foul_limit) | \(.timeout) | \(.max_plies) | \(.avg_plies | . * 10 | round / 10) | \(.fouls_a_per_game | . * 100 | round / 100) | \(.think_avg_ms_a | round)ms / \(.think_p99_ms_a_max | round)ms | \(.clock_used_pct_a | . * 10 | round / 10)% | \(.clock_min_s_a | . * 10 | round / 10)s |"' combined.json
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload combined result
        uses: actions/upload-artifact@v4
        with:
          name: arena-combined
          path: |
            combined.json
            all.jsonl
