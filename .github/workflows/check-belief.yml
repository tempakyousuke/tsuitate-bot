name: Check belief

# **issue #36 の P0-1 / P0-2 / P0-2b**: 王手駒仮説の**希釈**を、過去の Arena 実行の
# 棋譜（`arena-records-*`）に対して測る診断。**runtime の挙動は変えない**
# （`CheckSolver` に足したのは診断専用のフックだけで、設置しなければ既定挙動と
# bit-exact）。#31 / #34 と同じく**相手ごとに別ジョブ**で集計する
# （判定が「v13 / v14 の両相手で同方向」なので混ぜてはいけない）。
#
#   - P0-1 伝達の分解（`bin/check_belief_probe`。**記述のみ・中止の門は置かない**）:
#     ソルバー単体 q → 粒子投票後 q → `prior_legal` との積 → `blend_p_legal` →
#     cap → score → rank を、「真の王手駒を玉以外で取る手」と「誤仮説マスへの
#     捕獲の最大値」で対にして並べる。母集団は **bot の全王手中手番**
#     （反則0も**終端手番**も含む。落ちた本数は attrition として出す）
#   - P0-2 オラクル arm（`bin/check_policy` の `--belief`）:
#     `oracle@k*@shadow`（= issue の `oracle_p_only@k`）/
#     `oracle@kinf@real`（= **主 arm** `oracle_full_score@real`）/
#     `oracle_misdirected@k*`（adversarial stress test）/ `deduce_last_move`。
#     **`oracle@k1` は恒等対照**で、`current` と bit-exact でなければ判定以前
#   - P0-2b オラクルの継続上限（`bin/check_continue --policy oracle@kinf@real`）:
#     一手番強制→終局まで指し継いで勝率へ変換する。**対照は `current@real`**
#     （shadow の `current` と比べると「オラクル」と「指し直したこと」が混ざる）
#
# **P0-2 / P0-2b は既定では走らない**（`run_policy` / `run_continue`）。
# P0-1 は粒子を回すが1決定点あたり1回の `choose` で済むので軽く、既定で走る
# （`run_probe=false` で切れる。済んだ phase を再実行して 16 ジョブを無駄に
# 埋めないため。check-economy.yml の `run_probe` と同じ規約）。
# **全部を同時に有効化しない**（相手2 × シャードでジョブが詰まる）。
#
# 起動は arena.yml / check-prep.yml と同じ2通り（**通常のコード push では走らない**）:
#   1. Actions UI / `gh workflow run check-belief.yml -f arena_run_id=<Arena実行ID>`
#   2. `.github/ci/check-belief.request.json` を含む push
#      （リクエストファイルを消す push は plan が「削除された push」と判定して
#        全ジョブをスキップするので、後片付けで赤い run は残らない）
#
# **発見セットと検証セットを分ける**（issue #36）: 発見 = run 32697854659 /
# 33179939954、学習 = 新規に回す記録用アリーナ、検証 = **未使用の `match_seed`**。
# 検証セットの起動では `expect_match_seed` を必ず渡す（独立 seed を機械的に固定する）。
# 元 Arena 実行の実験条件の検査は `scripts/ci/verify_arena_provenance.sh`（共通）。
on:
  workflow_dispatch:
    inputs:
      arena_run_id:
        description: "棋譜の取得元 Arena 実行ID（空ならリポジトリの records/ を使う）"
        required: false
        default: ""
      opponents:
        description: "相手ごとに分けて集計する（空白区切り）。records/ を使うときは無視される"
        required: false
        default: "estimator_v13 estimator_v14"
      run_probe:
        description: "P0-1（伝達の分解）を走らせるか。済んだ phase を再実行しないために切れる"
        required: false
        default: "true"
      probe_seeds:
        description: "P0-1 の決定点あたり seed 数"
        required: false
        default: "3"
      probe_budget_ms:
        description: "P0-1 の思考予算（ms。**記録を取ったアリーナと揃えること**）"
        required: false
        default: "2000"
      probe_shards:
        description: "P0-1 の分割数（元対局単位。欠けたら aggregate が失敗する）。**母集団は #31 P0-4 の約3倍**（反則0の手番も終端手番も含む全王手中手番）なので既定を厚めに取ってある"
        required: false
        default: "8"
      run_policy:
        description: "P0-2（オラクル arm）も走らせるか。実再決定を含むので重い"
        required: false
        default: "false"
      policy_beliefs:
        description: "P0-2 の p-only arm（カンマ区切り）。`oracle@k1` は恒等対照なので外さない"
        required: false
        default: "oracle@k1,oracle@k2,oracle@k4,oracle@k8,oracle@kinf,oracle_misdirected@k4,oracle_misdirected@kinf,deduce_last_move"
      policy_beliefs_real:
        description: "P0-2 で実再決定まで回す arm（主 arm = oracle@kinf）"
        required: false
        default: "oracle@kinf"
      policy_seeds:
        description: "P0-2 の決定点あたり seed 数（実再決定 arm の AB/BA は seed の偶奇で閉じるので **2 以上の偶数**）"
        required: false
        default: "4"
      policy_budget_ms:
        description: "P0-2 の思考予算（ms）"
        required: false
        default: "2000"
      policy_shards:
        description: "P0-2 の分割数（元対局単位）"
        required: false
        default: "6"
      run_continue:
        description: "P0-2b（継続上限）も走らせるか。**継続対局を回すので最も重い**"
        required: false
        default: "false"
      continue_policy:
        description: "P0-2b で走らせる arm（カンマ区切り）。`current@real` は自動で入る"
        required: false
        default: "oracle@kinf@real"
      continue_main:
        description: "P0-2b の**主 arm**（合否を執行する1本。`continue_policy` に含まれていること）"
        required: false
        default: "oracle@kinf@real"
      continue_seeds:
        description: "P0-2b の決定点あたり seed 数"
        required: false
        default: "4"
      continue_budget_ms:
        description: "P0-2b の思考予算（ms。**ランキング段と継続段の両方に効く**。issue #36 は 2000）"
        required: false
        default: "2000"
      continue_shards:
        description: "P0-2b の分割数（元対局単位。欠けたら判定を出さない）"
        required: false
        default: "8"
      continue_replicates:
        description: "P0-2b を何回実行して平均するか（issue #36 は**常に 2**）"
        required: false
        default: "2"
      allow_legacy_think_budget:
        description: "元 Arena が commit 476483d より前で think_budget_ms_a が null のとき、その build の既定値 2000ms として解決してよいか。**発見セット run 32697854659 がこれに該当する**"
        required: false
        default: "false"
      expect_candidate:
        description: "元 Arena 実行の候補戦略（空なら照合しない）"
        required: false
        default: "estimator"
      expect_match_seed:
        description: "元 Arena 実行の match_seed base（**検証セットでは必ず指定する**）"
        required: false
        default: ""
      expect_commit:
        description: "元 Arena 実行の commit（head_sha）。空なら照合しない"
        required: false
        default: ""
      expect_games:
        description: "相手ごとの期待局数（空なら照合しない）"
        required: false
        default: ""
      expect_shards:
        description: "元 Arena 実行のシャード数（空なら照合しない）"
        required: false
        default: ""
  push:
    paths:
      - ".github/ci/check-belief.request.json"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.split.outputs.skip }}
      arena_run_id: ${{ steps.split.outputs.arena_run_id }}
      opponents: ${{ steps.split.outputs.opponents }}
      run_probe: ${{ steps.split.outputs.run_probe }}
      probe_seeds: ${{ steps.split.outputs.probe_seeds }}
      probe_budget_ms: ${{ steps.split.outputs.probe_budget_ms }}
      probe_shards: ${{ steps.split.outputs.probe_shards }}
      probe_shard_count: ${{ steps.split.outputs.probe_shard_count }}
      run_policy: ${{ steps.split.outputs.run_policy }}
      policy_beliefs: ${{ steps.split.outputs.policy_beliefs }}
      policy_beliefs_real: ${{ steps.split.outputs.policy_beliefs_real }}
      policy_seeds: ${{ steps.split.outputs.policy_seeds }}
      policy_budget_ms: ${{ steps.split.outputs.policy_budget_ms }}
      policy_shards: ${{ steps.split.outputs.policy_shards }}
      policy_shard_count: ${{ steps.split.outputs.policy_shard_count }}
      run_continue: ${{ steps.split.outputs.run_continue }}
      continue_policy: ${{ steps.split.outputs.continue_policy }}
      continue_main: ${{ steps.split.outputs.continue_main }}
      continue_seeds: ${{ steps.split.outputs.continue_seeds }}
      continue_budget_ms: ${{ steps.split.outputs.continue_budget_ms }}
      continue_shards: ${{ steps.split.outputs.continue_shards }}
      continue_shard_count: ${{ steps.split.outputs.continue_shard_count }}
      continue_replicate_list: ${{ steps.split.outputs.continue_replicate_list }}
      allow_legacy_think_budget: ${{ steps.split.outputs.allow_legacy_think_budget }}
      expect_candidate: ${{ steps.split.outputs.expect_candidate }}
      expect_match_seed: ${{ steps.split.outputs.expect_match_seed }}
      expect_commit: ${{ steps.split.outputs.expect_commit }}
      expect_games: ${{ steps.split.outputs.expect_games }}
      expect_shards: ${{ steps.split.outputs.expect_shards }}
    steps:
      - uses: actions/checkout@v5
      - id: split
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_RUN_ID: ${{ github.event.inputs.arena_run_id }}
          IN_OPPONENTS: ${{ github.event.inputs.opponents }}
          IN_RUN_PROBE: ${{ github.event.inputs.run_probe }}
          IN_PROBE_SEEDS: ${{ github.event.inputs.probe_seeds }}
          IN_PROBE_BUDGET: ${{ github.event.inputs.probe_budget_ms }}
          IN_PROBE_SHARDS: ${{ github.event.inputs.probe_shards }}
          IN_RUN_POLICY: ${{ github.event.inputs.run_policy }}
          IN_POLICY_BELIEFS: ${{ github.event.inputs.policy_beliefs }}
          IN_POLICY_BELIEFS_REAL: ${{ github.event.inputs.policy_beliefs_real }}
          IN_POLICY_SEEDS: ${{ github.event.inputs.policy_seeds }}
          IN_POLICY_BUDGET: ${{ github.event.inputs.policy_budget_ms }}
          IN_POLICY_SHARDS: ${{ github.event.inputs.policy_shards }}
          IN_RUN_CONTINUE: ${{ github.event.inputs.run_continue }}
          IN_CONTINUE_POLICY: ${{ github.event.inputs.continue_policy }}
          IN_CONTINUE_MAIN: ${{ github.event.inputs.continue_main }}
          IN_CONTINUE_SEEDS: ${{ github.event.inputs.continue_seeds }}
          IN_CONTINUE_BUDGET: ${{ github.event.inputs.continue_budget_ms }}
          IN_CONTINUE_SHARDS: ${{ github.event.inputs.continue_shards }}
          IN_CONTINUE_REPLICATES: ${{ github.event.inputs.continue_replicates }}
          IN_ALLOW_LEGACY_BUDGET: ${{ github.event.inputs.allow_legacy_think_budget }}
          IN_EXP_CAND: ${{ github.event.inputs.expect_candidate }}
          IN_EXP_SEED: ${{ github.event.inputs.expect_match_seed }}
          IN_EXP_COMMIT: ${{ github.event.inputs.expect_commit }}
          IN_EXP_GAMES: ${{ github.event.inputs.expect_games }}
          IN_EXP_SHARDS: ${{ github.event.inputs.expect_shards }}
        run: |
          set -euo pipefail
          req='.github/ci/check-belief.request.json'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="${IN_RUN_ID:-}"
            opponents="${IN_OPPONENTS:-estimator_v13 estimator_v14}"
            run_probe="${IN_RUN_PROBE:-true}"
            probe_seeds="${IN_PROBE_SEEDS:-3}"
            probe_budget="${IN_PROBE_BUDGET:-2000}"
            probe_shards="${IN_PROBE_SHARDS:-8}"
            run_policy="${IN_RUN_POLICY:-false}"
            policy_beliefs="${IN_POLICY_BELIEFS:-}"
            policy_beliefs_real="${IN_POLICY_BELIEFS_REAL:-oracle@kinf}"
            policy_seeds="${IN_POLICY_SEEDS:-4}"
            policy_budget="${IN_POLICY_BUDGET:-2000}"
            policy_shards="${IN_POLICY_SHARDS:-6}"
            run_continue="${IN_RUN_CONTINUE:-false}"
            continue_policy="${IN_CONTINUE_POLICY:-oracle@kinf@real}"
            continue_main="${IN_CONTINUE_MAIN:-oracle@kinf@real}"
            continue_seeds="${IN_CONTINUE_SEEDS:-4}"
            continue_budget="${IN_CONTINUE_BUDGET:-2000}"
            continue_shards="${IN_CONTINUE_SHARDS:-8}"
            continue_reps="${IN_CONTINUE_REPLICATES:-2}"
            allow_legacy_budget="${IN_ALLOW_LEGACY_BUDGET:-false}"
            exp_cand="${IN_EXP_CAND-estimator}"
            exp_seed="${IN_EXP_SEED:-}"
            exp_commit="${IN_EXP_COMMIT:-}"
            exp_games="${IN_EXP_GAMES:-}"
            exp_shards="${IN_EXP_SHARDS:-}"
          else
            if [ ! -f "$req" ]; then
              # push の paths フィルタは削除にも一致する。計測後に $req を消す
              # commit は後片付けの正常系なので、赤い run を残さず全部スキップ
              echo "リクエストファイルが削除された push（後片付け）なので何もしない"
              {
                echo "skip=true"
                echo "arena_run_id="
                echo 'opponents=[""]'
                echo "run_probe=false"
                echo "probe_seeds=3"
                echo "probe_budget_ms=2000"
                echo 'probe_shards=[0]'
                echo "probe_shard_count=1"
                echo "run_policy=false"
                echo "policy_beliefs="
                echo "policy_beliefs_real="
                echo "policy_seeds=4"
                echo "policy_budget_ms=2000"
                echo 'policy_shards=[0]'
                echo "policy_shard_count=1"
                echo "run_continue=false"
                echo "continue_policy="
                echo "continue_main="
                echo "continue_seeds=4"
                echo "continue_budget_ms=2000"
                echo 'continue_shards=[0]'
                echo "continue_shard_count=1"
                echo 'continue_replicate_list=[0]'
                echo "allow_legacy_think_budget=false"
                echo "expect_candidate="
                echo "expect_match_seed="
                echo "expect_commit="
                echo "expect_games="
                echo "expect_shards="
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            run_id=$(jq -r '.arena_run_id // ""' "$req")
            opponents=$(jq -r 'if (.opponents | type) == "array" then (.opponents | join(" ")) else (.opponents // "estimator_v13 estimator_v14") end' "$req")
            # `// true` は **false も既定値扱いになる**（jq の `//` は null と false を
            # 同じに扱う）。has() で「キーがあるか」を見る（mate-economy.yml と同じ）
            run_probe=$(jq -r 'if has("run_probe") then .run_probe else true end | tostring' "$req")
            probe_seeds=$(jq -r '.probe_seeds // 3' "$req")
            probe_budget=$(jq -r '.probe_budget_ms // 2000' "$req")
            probe_shards=$(jq -r '.probe_shards // 8' "$req")
            run_policy=$(jq -r '.run_policy // false | tostring' "$req")
            policy_beliefs=$(jq -r '.policy_beliefs // ""' "$req")
            policy_beliefs_real=$(jq -r '.policy_beliefs_real // "oracle@kinf"' "$req")
            policy_seeds=$(jq -r '.policy_seeds // 4' "$req")
            policy_budget=$(jq -r '.policy_budget_ms // 2000' "$req")
            policy_shards=$(jq -r '.policy_shards // 6' "$req")
            run_continue=$(jq -r '.run_continue // false | tostring' "$req")
            continue_policy=$(jq -r '.continue_policy // "oracle@kinf@real"' "$req")
            continue_main=$(jq -r '.continue_main // "oracle@kinf@real"' "$req")
            continue_seeds=$(jq -r '.continue_seeds // 4' "$req")
            continue_budget=$(jq -r '.continue_budget_ms // 2000' "$req")
            continue_shards=$(jq -r '.continue_shards // 8' "$req")
            continue_reps=$(jq -r '.continue_replicates // 2' "$req")
            allow_legacy_budget=$(jq -r 'if has("allow_legacy_think_budget") then .allow_legacy_think_budget else false end | tostring' "$req")
            exp_cand=$(jq -r 'if has("expect_candidate") then .expect_candidate else "estimator" end' "$req")
            exp_seed=$(jq -r '.expect_match_seed // ""' "$req")
            exp_commit=$(jq -r '.expect_commit // ""' "$req")
            exp_games=$(jq -r '.expect_games // ""' "$req")
            exp_shards=$(jq -r '.expect_shards // ""' "$req")
          fi
          # 記録元が無い（リポジトリの records/ を使う）ときは1ジョブだけ回す
          if [ -z "$run_id" ]; then
            opponents=""
          fi
          # **seed の偶奇は plan で落とす**（PR #37 レビュー7巡目 [P1]）。
          # `bin/check_policy` / `bin/check_continue` は実再決定・継続を回すときに
          # 2 以上の偶数を要求する（AB/BA が seed の偶奇で閉じる）ので、奇数だと
          # matrix の全ジョブが起動直後に落ちる。ここで1回だけ失敗させる
          # **P0-2b の採否は held-out 検証セットに固定する**（PR #37 レビュー14巡目 [P1]）。
          # 事前登録は「検証 = 未使用の `match_seed`」「主量は (Δv13 + Δv14)/2、
          # veto は Δv13 > 0 && Δv14 > 0」。run ID か seed が空だと provenance が
          # スキップ／照合なしになり、発見・学習に使った Arena run でも最終 gate が
          # 緑になる。相手集合も任意にすると、`opponents=estimator_v14` の1層だけで
          # 「通過」を返せてしまう（summary は合算と表示するのに）
          if [ "$run_continue" = "true" ]; then
            if [ -z "$run_id" ]; then
              echo "::error::run_continue=true には arena_run_id が必須です（records/ 経路は P0-2b の採否に使えない）"
              exit 1
            fi
            if [ -z "$exp_seed" ]; then
              echo "::error::run_continue=true には expect_match_seed が必須です（held-out 検証セットであることを機械的に固定する）"
              exit 1
            fi
            sorted_opp=$(printf '%s' "$opponents" | tr ' ' '\n' | grep -v '^$' | sort | tr '\n' ' ')
            if [ "$sorted_opp" != "estimator_v13 estimator_v14 " ]; then
              echo "::error::run_continue=true の相手集合は {estimator_v13, estimator_v14} 固定です（事前登録の主量が (Δv13+Δv14)/2 なので）: $opponents"
              exit 1
            fi
          fi
          # **主 arm は1本で、`continue_policy` に含まれていること**
          # （PR #37 レビュー13巡目 [P2]）。`continue_policy` はカンマ区切りなので、
          # それをそのまま `--main` へ渡すと「`a,b` という名前の arm」を探して
          # 全 continuation を完走した後に必ず失敗する
          if [ "$run_continue" = "true" ]; then
            case "$continue_main" in
              *,*) echo "::error::continue_main は1本だけ指定してください: $continue_main"; exit 1 ;;
              "") echo "::error::continue_main が空です"; exit 1 ;;
            esac
            if ! printf '%s' "$continue_policy" | tr ',' '\n' | grep -qxF "$continue_main"; then
              echo "::error::continue_main ($continue_main) が continue_policy ($continue_policy) に含まれていません"
              exit 1
            fi
          fi
          # **継続は常に2 replicate**（issue #36 の事前登録。PR #37 レビュー11巡目 [P1]）。
          # 1本だけの壁時計測定でも CI と verdict は出てしまうので、ここで拒否する
          if [ "$run_continue" = "true" ] && [ "$continue_reps" != "2" ]; then
            echo "::error::continue_replicates は 2 固定です（issue #36 の事前登録。2回実行の平均が契約）: $continue_reps"
            exit 1
          fi
          for pair in "policy:$run_policy:$policy_seeds" "continue:$run_continue:$continue_seeds"; do
            phase=${pair%%:*}; rest=${pair#*:}; on=${rest%%:*}; n=${rest#*:}
            [ "$on" = "true" ] || continue
            case "$n" in
              ''|*[!0-9]*) echo "::error::${phase}_seeds が数値ではありません: $n"; exit 1 ;;
            esac
            if [ "$n" -lt 2 ] || [ $((n % 2)) -ne 0 ]; then
              echo "::error::${phase}_seeds は 2 以上の偶数にしてください（実再決定 arm の AB/BA は seed の偶奇で閉じる）: $n"
              exit 1
            fi
          done
          {
            echo "skip=false"
            echo "arena_run_id=$run_id"
            echo "opponents=$(jq -n -c --arg s "$opponents" 'if $s == "" then [""] else ($s | split(" ") | map(select(. != ""))) end')"
            echo "run_probe=$run_probe"
            echo "probe_seeds=$probe_seeds"
            echo "probe_budget_ms=$probe_budget"
            echo "probe_shards=$(jq -n -c --argjson n "$probe_shards" '[range($n)]')"
            echo "probe_shard_count=$probe_shards"
            echo "run_policy=$run_policy"
            echo "policy_beliefs=$policy_beliefs"
            echo "policy_beliefs_real=$policy_beliefs_real"
            echo "policy_seeds=$policy_seeds"
            echo "policy_budget_ms=$policy_budget"
            echo "policy_shards=$(jq -n -c --argjson n "$policy_shards" '[range($n)]')"
            echo "policy_shard_count=$policy_shards"
            echo "run_continue=$run_continue"
            echo "continue_policy=$continue_policy"
            echo "continue_main=$continue_main"
            echo "continue_seeds=$continue_seeds"
            echo "continue_budget_ms=$continue_budget"
            echo "continue_shards=$(jq -n -c --argjson n "$continue_shards" '[range($n)]')"
            echo "continue_shard_count=$continue_shards"
            echo "continue_replicate_list=$(jq -n -c --argjson n "$continue_reps" '[range($n)]')"
            echo "allow_legacy_think_budget=$allow_legacy_budget"
            echo "expect_candidate=$exp_cand"
            echo "expect_match_seed=$exp_seed"
            echo "expect_commit=$exp_commit"
            echo "expect_games=$exp_games"
            echo "expect_shards=$exp_shards"
          } >> "$GITHUB_OUTPUT"

  probe:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.run_probe == 'true'
    strategy:
      fail-fast: false
      matrix:
        opponent: ${{ fromJSON(needs.plan.outputs.opponents) }}
        shard: ${{ fromJSON(needs.plan.outputs.probe_shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download arena records
        if: needs.plan.outputs.arena_run_id != ''
        uses: actions/download-artifact@v7
        with:
          pattern: arena-records-${{ matrix.opponent }}-*
          path: records-in
          run-id: ${{ needs.plan.outputs.arena_run_id }}
          github-token: ${{ github.token }}
      - name: Download arena summaries
        if: needs.plan.outputs.arena_run_id != ''
        uses: actions/download-artifact@v7
        with:
          pattern: arena-result-${{ matrix.opponent }}-*
          path: summaries-in
          run-id: ${{ needs.plan.outputs.arena_run_id }}
          github-token: ${{ github.token }}
      - name: Download arena combined
        if: needs.plan.outputs.arena_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: arena-combined
          path: combined-in
          run-id: ${{ needs.plan.outputs.arena_run_id }}
          github-token: ${{ github.token }}
      - name: Verify arena provenance
        if: needs.plan.outputs.arena_run_id != ''
        env:
          OPPONENT: ${{ matrix.opponent }}
          RUN_ID: ${{ needs.plan.outputs.arena_run_id }}
          GH_TOKEN: ${{ github.token }}
          EXPECT_CANDIDATE: ${{ needs.plan.outputs.expect_candidate }}
          EXPECT_MATCH_SEED: ${{ needs.plan.outputs.expect_match_seed }}
          EXPECT_COMMIT: ${{ needs.plan.outputs.expect_commit }}
          EXPECT_GAMES: ${{ needs.plan.outputs.expect_games }}
          EXPECT_SHARDS: ${{ needs.plan.outputs.expect_shards }}
          # **この phase の実効予算が元 Arena と一致することを検査する**
          # （PR #37 レビュー [P1]。違う予算で引き直したランキングは
          #  「記録時に実際に見えていたランキング」ではない）
          EXPECT_THINK_BUDGET_MS: ${{ needs.plan.outputs.probe_budget_ms }}
          ALLOW_LEGACY_THINK_BUDGET: ${{ needs.plan.outputs.allow_legacy_think_budget == 'true' && '1' || '' }}
        run: bash scripts/ci/verify_arena_provenance.sh
      - name: P0-1 transmission
        env:
          TSUITATE_THINK_BUDGET_MS: ${{ needs.plan.outputs.probe_budget_ms }}
        run: |
          set -euo pipefail
          run_id='${{ needs.plan.outputs.arena_run_id }}'
          if [ -n "$run_id" ]; then
            src=records-in
            if [ -z "$(find "$src" -name '*.jsonl' 2>/dev/null | head -1)" ]; then
              echo "run $run_id から相手 '${{ matrix.opponent }}' の記録を取得できませんでした" >&2
              exit 1
            fi
          else
            src=records
          fi
          files=$(find "$src" -name '*.jsonl' | sort)
          opp='${{ matrix.opponent }}'
          [ -n "$opp" ] && set -- --opponent "$opp" || set --
          # シャード単独では母集団が揃わないので集計は aggregate に任せる
          cargo run --release --bin check_belief_probe -- "$@" \
            --seeds '${{ needs.plan.outputs.probe_seeds }}' \
            --shard '${{ matrix.shard }}/${{ needs.plan.outputs.probe_shard_count }}' \
            --allow-incomplete \
            --out "check-belief-${{ matrix.opponent }}-s${{ matrix.shard }}.jsonl" \
            $files | tee probe.txt
      - uses: actions/upload-artifact@v6
        with:
          name: check-belief-${{ matrix.opponent }}-s${{ matrix.shard }}
          path: |
            check-belief-*.jsonl
            probe.txt
            provenance.env
          if-no-files-found: error

  probe-aggregate:
    needs: [plan, probe]
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.run_probe == 'true'
    strategy:
      fail-fast: false
      matrix:
        opponent: ${{ fromJSON(needs.plan.outputs.opponents) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v7
        with:
          pattern: check-belief-${{ matrix.opponent }}-s*
          path: shards
      - name: Aggregate
        run: |
          set -euo pipefail
          files=$(find shards -name 'check-belief-*.jsonl' | sort)
          if [ -z "$files" ]; then
            echo "シャードの JSONL がありません" >&2
            exit 1
          fi
          # **シャードが欠けたら失敗**（母集団の分母が縮む）
          cargo run --release --bin check_belief_probe -- report $files | tee report.txt
          {
            echo "## P0-1 伝達の分解（相手 ${{ matrix.opponent }}）"
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: check-belief-report-${{ matrix.opponent }}
          path: report.txt
          if-no-files-found: error

  policy:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.run_policy == 'true'
    strategy:
      fail-fast: false
      matrix:
        opponent: ${{ fromJSON(needs.plan.outputs.opponents) }}
        shard: ${{ fromJSON(needs.plan.outputs.policy_shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download arena records
        if: needs.plan.outputs.arena_run_id != ''
        uses: actions/download-artifact@v7
        with:
          pattern: arena-records-${{ matrix.opponent }}-*
          path: records-in
          run-id: ${{ needs.plan.outputs.arena_run_id }}
          github-token: ${{ github.token }}
      - name: Download arena summaries
        if: needs.plan.outputs.arena_run_id != ''
        uses: actions/download-artifact@v7
        with:
          pattern: arena-result-${{ matrix.opponent }}-*
          path: summaries-in
          run-id: ${{ needs.plan.outputs.arena_run_id }}
          github-token: ${{ github.token }}
      - name: Download arena combined
        if: needs.plan.outputs.arena_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: arena-combined
          path: combined-in
          run-id: ${{ needs.plan.outputs.arena_run_id }}
          github-token: ${{ github.token }}
      # **どの phase も検証済み provenance に依存させる**（PR #37 レビュー [P1]）。
      # probe だけを検査していた頃は、元2000ms の正常な run に policy 700ms を
      # 指定しても緑になり、記録と違う粒子数で引いたランキングを採否に使えた
      - name: Verify arena provenance
        if: needs.plan.outputs.arena_run_id != ''
        env:
          OPPONENT: ${{ matrix.opponent }}
          RUN_ID: ${{ needs.plan.outputs.arena_run_id }}
          GH_TOKEN: ${{ github.token }}
          EXPECT_CANDIDATE: ${{ needs.plan.outputs.expect_candidate }}
          EXPECT_MATCH_SEED: ${{ needs.plan.outputs.expect_match_seed }}
          EXPECT_COMMIT: ${{ needs.plan.outputs.expect_commit }}
          EXPECT_GAMES: ${{ needs.plan.outputs.expect_games }}
          EXPECT_SHARDS: ${{ needs.plan.outputs.expect_shards }}
          EXPECT_THINK_BUDGET_MS: ${{ needs.plan.outputs.policy_budget_ms }}
          ALLOW_LEGACY_THINK_BUDGET: ${{ needs.plan.outputs.allow_legacy_think_budget == 'true' && '1' || '' }}
        run: bash scripts/ci/verify_arena_provenance.sh
      - name: P0-2 oracle arms
        env:
          TSUITATE_THINK_BUDGET_MS: ${{ needs.plan.outputs.policy_budget_ms }}
        run: |
          set -euo pipefail
          run_id='${{ needs.plan.outputs.arena_run_id }}'
          if [ -n "$run_id" ]; then
            src=records-in
            if [ -z "$(find "$src" -name '*.jsonl' 2>/dev/null | head -1)" ]; then
              echo "記録を取得できませんでした" >&2
              exit 1
            fi
          else
            src=records
          fi
          files=$(find "$src" -name '*.jsonl' | sort)
          opp='${{ matrix.opponent }}'
          [ -n "$opp" ] && set -- --opponent "$opp" || set --
          beliefs='${{ needs.plan.outputs.policy_beliefs }}'
          [ -n "$beliefs" ] && set -- "$@" --belief "$beliefs" || true
          real='${{ needs.plan.outputs.policy_beliefs_real }}'
          set -- "$@" --belief-real "$real"
          cargo run --release --bin check_policy -- "$@" \
            --seeds '${{ needs.plan.outputs.policy_seeds }}' \
            --shard '${{ matrix.shard }}/${{ needs.plan.outputs.policy_shard_count }}' \
            --allow-incomplete \
            --out "check-policy-${{ matrix.opponent }}-s${{ matrix.shard }}.jsonl" \
            $files | tee policy.txt
      - uses: actions/upload-artifact@v6
        with:
          name: check-belief-policy-${{ matrix.opponent }}-s${{ matrix.shard }}
          path: |
            check-policy-*.jsonl
            policy.txt
            provenance.env
          if-no-files-found: error

  policy-aggregate:
    needs: [plan, policy]
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.run_policy == 'true'
    strategy:
      fail-fast: false
      matrix:
        opponent: ${{ fromJSON(needs.plan.outputs.opponents) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v7
        with:
          pattern: check-belief-policy-${{ matrix.opponent }}-s*
          path: shards
      - name: Aggregate
        run: |
          set -euo pipefail
          files=$(find shards -name 'check-policy-*.jsonl' | sort)
          [ -n "$files" ] || { echo "シャードの JSONL がありません" >&2; exit 1; }
          # **シャードが欠けたら失敗**（決定点の分母が狂う）
          cargo run --release --bin check_policy -- report \
            --shards '${{ needs.plan.outputs.policy_shard_count }}' $files | tee report.txt
          {
            echo "## P0-2 オラクル arm（相手 ${{ matrix.opponent }}）"
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: check-belief-policy-report-${{ matrix.opponent }}
          path: report.txt
          if-no-files-found: error

  # **相手をまたいだ最終判定**（issue #36 の契約）。相手ごとの report を並べる
  # だけでは、主 CI 下限も veto も安全性 margin も検査されない
  # （PR #37 レビュー4巡目 [P1]）。fail-closed（判定が通らなければ赤）
  policy-combined:
    needs: [plan, policy]
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.run_policy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v7
        with:
          pattern: check-belief-policy-*-s*
          path: shards
      - name: Combined gate
        run: |
          set -euo pipefail
          files=$(find shards -name 'check-policy-*.jsonl' | sort)
          [ -n "$files" ] || { echo "シャードの JSONL がありません" >&2; exit 1; }
          # `combined` は相手ごとに入力契約（シャードの完全性・実験キー）を通してから
          # (Δv13 + Δv14)/2 の層化 cluster bootstrap と veto を判定する
          cargo run --release --bin check_policy -- combined $files | tee combined.txt
          {
            echo "## P0-2 の最終判定（opponent-balanced 合算）"
            echo '```'
            cat combined.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: check-belief-policy-combined
          path: combined.txt
          if-no-files-found: warn

  continue:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.run_continue == 'true'
    strategy:
      fail-fast: false
      matrix:
        opponent: ${{ fromJSON(needs.plan.outputs.opponents) }}
        shard: ${{ fromJSON(needs.plan.outputs.continue_shards) }}
        replicate: ${{ fromJSON(needs.plan.outputs.continue_replicate_list) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download arena records
        if: needs.plan.outputs.arena_run_id != ''
        uses: actions/download-artifact@v7
        with:
          pattern: arena-records-${{ matrix.opponent }}-*
          path: records-in
          run-id: ${{ needs.plan.outputs.arena_run_id }}
          github-token: ${{ github.token }}
      - name: Download arena summaries
        if: needs.plan.outputs.arena_run_id != ''
        uses: actions/download-artifact@v7
        with:
          pattern: arena-result-${{ matrix.opponent }}-*
          path: summaries-in
          run-id: ${{ needs.plan.outputs.arena_run_id }}
          github-token: ${{ github.token }}
      - name: Download arena combined
        if: needs.plan.outputs.arena_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: arena-combined
          path: combined-in
          run-id: ${{ needs.plan.outputs.arena_run_id }}
          github-token: ${{ github.token }}
      # ランキング段は記録と同じ予算でなければならない（継続段も同じ env を使う）
      - name: Verify arena provenance
        if: needs.plan.outputs.arena_run_id != ''
        env:
          OPPONENT: ${{ matrix.opponent }}
          RUN_ID: ${{ needs.plan.outputs.arena_run_id }}
          GH_TOKEN: ${{ github.token }}
          EXPECT_CANDIDATE: ${{ needs.plan.outputs.expect_candidate }}
          EXPECT_MATCH_SEED: ${{ needs.plan.outputs.expect_match_seed }}
          EXPECT_COMMIT: ${{ needs.plan.outputs.expect_commit }}
          EXPECT_GAMES: ${{ needs.plan.outputs.expect_games }}
          EXPECT_SHARDS: ${{ needs.plan.outputs.expect_shards }}
          EXPECT_THINK_BUDGET_MS: ${{ needs.plan.outputs.continue_budget_ms }}
          ALLOW_LEGACY_THINK_BUDGET: ${{ needs.plan.outputs.allow_legacy_think_budget == 'true' && '1' || '' }}
        run: bash scripts/ci/verify_arena_provenance.sh
      - name: P0-2b oracle continuation
        env:
          TSUITATE_THINK_BUDGET_MS: ${{ needs.plan.outputs.continue_budget_ms }}
        run: |
          set -euo pipefail
          run_id='${{ needs.plan.outputs.arena_run_id }}'
          if [ -n "$run_id" ]; then
            src=records-in
            if [ -z "$(find "$src" -name '*.jsonl' 2>/dev/null | head -1)" ]; then
              echo "記録を取得できませんでした" >&2
              exit 1
            fi
          else
            src=records
          fi
          files=$(find "$src" -name '*.jsonl' | sort)
          opp='${{ matrix.opponent }}'
          [ -n "$opp" ] && set -- --opponent "$opp" || set --
          cargo run --release --bin check_continue -- "$@" \
            --policy '${{ needs.plan.outputs.continue_policy }}' \
            --seeds '${{ needs.plan.outputs.continue_seeds }}' \
            --arena-run-id '${{ needs.plan.outputs.arena_run_id }}' \
            --match-seed-base '${{ needs.plan.outputs.expect_match_seed }}' \
            --replicate '${{ matrix.replicate }}' \
            --shard '${{ matrix.shard }}/${{ needs.plan.outputs.continue_shard_count }}' \
            --allow-incomplete \
            --out "check-continue-${{ matrix.opponent }}-r${{ matrix.replicate }}-s${{ matrix.shard }}.jsonl" \
            $files | tee continue.txt
      - uses: actions/upload-artifact@v6
        with:
          name: check-belief-continue-${{ matrix.opponent }}-r${{ matrix.replicate }}-s${{ matrix.shard }}
          path: |
            check-continue-*.jsonl
            continue.txt
            provenance.env
          if-no-files-found: error

  continue-aggregate:
    needs: [plan, continue]
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.run_continue == 'true'
    strategy:
      fail-fast: false
      matrix:
        opponent: ${{ fromJSON(needs.plan.outputs.opponents) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v7
        with:
          pattern: check-belief-continue-${{ matrix.opponent }}-*
          path: shards
      - name: Aggregate
        run: |
          set -euo pipefail
          files=$(find shards -name 'check-continue-*.jsonl' | sort)
          [ -n "$files" ] || { echo "シャードの JSONL がありません" >&2; exit 1; }
          # **対照は `current@real`**（shadow の current と比べると
          # 「オラクル」と「指し直したこと」の効果が混ざる）。
          # **相手別 report に `--main` は渡さない**（PR #37 レビュー12巡目 [P1]）:
          # `--main` は「Δ ≥ +0.04 かつ**その相手の** CI 下限 > 0」を要求するが、
          # issue #36 の事前登録は「**合算**で +0.04・合算 CI 下限 > 0」＋
          # 「相手別は**点推定の符号** veto だけ」で、104局×2 で相手別の CI 下限まで
          # 正にするのは強すぎると明記されている（v13 +0.01 / v14 +0.09 は
          # 合算 +0.05・両相手とも正で通過すべきなのに v13 の相手別が落ちる）。
          # **合否は `continue-combined` だけが執行する**
          cargo run --release --bin check_continue -- report \
            --baseline current@real $files | tee report.txt
          {
            echo "## P0-2b オラクルの継続上限（相手 ${{ matrix.opponent }}）"
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: check-belief-continue-report-${{ matrix.opponent }}
          path: report.txt
          if-no-files-found: error

  # **事前登録した最終判定はここでしか執行されない**（PR #37 レビュー11巡目 [P1]）。
  # 相手ごとの `report` を並べるだけでは、opponent-balanced な主 endpoint
  # `Δcombined = (Δv13 + Δv14)/2` も符号 veto も計算されない
  continue-combined:
    needs: [plan, continue]
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.run_continue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v7
        with:
          pattern: check-belief-continue-*-r*-s*
          path: shards
      - name: Combined gate
        run: |
          set -euo pipefail
          files=$(find shards -name 'check-continue-*.jsonl' | sort)
          [ -n "$files" ] || { echo "シャードの JSONL がありません" >&2; exit 1; }
          # 相手ごとに入力契約（シャードの完全性・実験キー・**replicate が2本**）を
          # 通してから (Δv13 + Δv14)/2 の層化 cluster bootstrap と veto を判定する。
          # 不通過なら exit 3（fail-closed）
          # **主 arm は plan の `continue_main`**（レビュー13巡目 [P2]。
          # `continue_policy` はカンマ区切りなので丸ごと渡すと必ず失敗した）。
          # **相手集合は `--expect-opponents` を渡さずバイナリ既定の
          # {estimator_v13, estimator_v14} のまま**にする（同 14巡目 [P1]）:
          # plan の任意の `opponents` を渡すと、`opponents=estimator_v14` の
          # 1層だけで「通過」を返せてしまう。plan 側でも集合を固定しているので
          # 二重の関門になる
          cargo run --release --bin check_continue -- combined \
            --baseline current@real --main '${{ needs.plan.outputs.continue_main }}' \
            --expect-replicates 2 $files | tee combined.txt
          {
            echo "## P0-2b の最終判定（opponent-balanced 合算）"
            echo '```'
            cat combined.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: check-belief-continue-combined
          path: combined.txt
          if-no-files-found: warn
