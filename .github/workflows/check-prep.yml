name: Check prep

# **issue #34 の P0-1 / P0-2**: 被王手の**前**の準備（王手耐性）を、過去の Arena
# 実行の棋譜（`arena-records-*`）に対して測る診断。**runtime の挙動は変えない**
# （`bin/analyze` の集計セクションと `bin/check_prep_probe` を足しただけで、
# 粒子も回さない）。#31 の Check economy と同じ形で**相手ごとに別ジョブ**で
# 集計する（判定が「v13 / v14 の両相手で同方向」なので混ぜてはいけない）。
#
#   - P0-1 連続王手の起点（`bin/analyze` の常設セクション）: bot が玉の手で
#     王手を解消した直後に再び王手されたとき、2回目の王手駒が
#     「前の玉位置 / その隣接 / それ以外」のどこから来たか。門は頻度ではなく
#     **`頻度 × 被覆の有無による反則差`** とその元対局 cluster CI
#   - P0-2 較正プローブ（`bin/check_prep_probe`）: **単位は bot の全 handoff**
#     （被王手手番だけに条件づけると collider が開く）。段は3つで、前が落ちたら
#     次へ進まない — ①構成概念検証（F1 の起点別被覆 vs 「玉以外で王手駒を真に
#     合法に取れたか」）②発火母数 ③主 estimand（層を固定した Q90 − Q10 の
#     周辺平均差。hurdle 分解）
#
# どちらも粒子を回さないので軽い（実測: 59局で抽出 0.6 秒 + bootstrap 数十秒）。
# **通常のコード push では走らない**。起動は2通り:
#   1. Actions UI / `gh workflow run check-prep.yml -f arena_run_id=<Arena実行ID>`
#   2. `.github/ci/check-prep.request.json` を含む push
#      （リクエストファイルを消す push は plan が「削除された push」と判定して
#        全ジョブをスキップするので、後片付けで赤い run は残らない）
#
# **発見セットと検証セットを分ける**（issue #34）: 特徴量の定義・距離重み
# （`origin_weights`）・`adj_share`・主特徴量・主目的変数は発見セットで固定してから、
# **未使用の `match_seed` で取り直した Arena 実行**を指す別の起動で検証する。
#
# **元 Arena 実行の実験条件は機械的に検査する**（PR #35 レビュー [P1]）: 記録の
# `match` / `end` にあるのは戦略名と相手名だけで、CSV meta の `source_fingerprint` は
# 解析バイナリの版でしかない。同じ run の `arena-result-*`（`arena-summary.json` =
# candidate / baseline / 実効設定の指紋 / 局数 / 時計 / 予算 / match_seed_base、
# `arena-games.jsonl` = commit）と `arena-combined` も取り、**シャード集合が 0..n-1 で完備・
# 実効設定が全シャード一致・局数と記録本数が一致・合算局数と一致**を確かめてから
# 解析する。`expect_candidate` / `expect_match_seed` / `expect_games` を渡すと
# 期待値との照合も入る（**検証セットでは `expect_match_seed` を必ず渡す** =
# 発見セットと独立な seed であることを機械的に固定するため）。
on:
  workflow_dispatch:
    inputs:
      arena_run_id:
        description: "棋譜の取得元 Arena 実行ID（空ならリポジトリの records/ を使う）"
        required: false
        default: ""
      opponents:
        description: "相手ごとに分けて集計する（空白区切り。artifact 名 arena-records-<相手>-* を引く）。records/ を使うときは無視される"
        required: false
        default: "estimator_v13 estimator_v14"
      origin_weights:
        description: "王手起点の重み（例 knight:1,line:1,diag:1;d2:4,d3:2,d4:1,d5+:1）。空なら一様。**発見セットの実測分布から決めて検証セットでは固定する**"
        required: false
        default: ""
      adj_share:
        description: "f13_cov の隣接シェア（0〜1）。**発見セットの実測（隣接から来た王手の割合）で固定する**"
        required: false
        default: "0.5"
      bootstrap:
        description: "元対局 cluster bootstrap の反復数（主 estimand の CI と p 値）"
        required: false
        default: "500"
      expect_candidate:
        description: "元 Arena 実行の候補戦略（arena-summary.json の candidate と照合。空なら照合しない）"
        required: false
        default: "estimator"
      expect_match_seed:
        description: "元 Arena 実行の match_seed（**shard ずらしと基準ごとの XOR を掛ける前の base seed** = arena.yml の match_seed 入力そのもの。arena-summary.json の match_seed_base と照合する。**検証セットでは必ず指定する** = 発見セットと独立な seed であることを機械的に固定するため。`match_seed_base` は PR #35 で足したフィールドなので、それより前の commit で回した run には指定できない）"
        required: false
        default: ""
      expect_commit:
        description: "元 Arena 実行の commit（head_sha）。空なら照合せず記録だけする"
        required: false
        default: ""
      expect_games:
        description: "相手ごとの期待局数（空なら照合しない。104 などを入れると部分失敗した run を弾ける）"
        required: false
        default: ""
      expect_shards:
        description: "元 Arena 実行のシャード数（空なら照合しない。合算局数の照合と合わせて末尾シャードの欠落を確実に弾ける）"
        required: false
        default: ""
  push:
    paths:
      - ".github/ci/check-prep.request.json"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.split.outputs.skip }}
      arena_run_id: ${{ steps.split.outputs.arena_run_id }}
      opponents: ${{ steps.split.outputs.opponents }}
      origin_weights: ${{ steps.split.outputs.origin_weights }}
      adj_share: ${{ steps.split.outputs.adj_share }}
      bootstrap: ${{ steps.split.outputs.bootstrap }}
      expect_candidate: ${{ steps.split.outputs.expect_candidate }}
      expect_match_seed: ${{ steps.split.outputs.expect_match_seed }}
      expect_commit: ${{ steps.split.outputs.expect_commit }}
      expect_games: ${{ steps.split.outputs.expect_games }}
      expect_shards: ${{ steps.split.outputs.expect_shards }}
    steps:
      - uses: actions/checkout@v5
      - id: split
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_RUN_ID: ${{ github.event.inputs.arena_run_id }}
          IN_OPPONENTS: ${{ github.event.inputs.opponents }}
          IN_WEIGHTS: ${{ github.event.inputs.origin_weights }}
          IN_ADJ: ${{ github.event.inputs.adj_share }}
          IN_BOOT: ${{ github.event.inputs.bootstrap }}
          IN_EXP_CAND: ${{ github.event.inputs.expect_candidate }}
          IN_EXP_SEED: ${{ github.event.inputs.expect_match_seed }}
          IN_EXP_COMMIT: ${{ github.event.inputs.expect_commit }}
          IN_EXP_GAMES: ${{ github.event.inputs.expect_games }}
          IN_EXP_SHARDS: ${{ github.event.inputs.expect_shards }}
        run: |
          set -euo pipefail
          req='.github/ci/check-prep.request.json'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="${IN_RUN_ID:-}"
            opponents="${IN_OPPONENTS:-estimator_v13 estimator_v14}"
            weights="${IN_WEIGHTS:-}"
            adj="${IN_ADJ:-0.5}"
            boot="${IN_BOOT:-500}"
            exp_cand="${IN_EXP_CAND-estimator}"
            exp_seed="${IN_EXP_SEED:-}"
            exp_commit="${IN_EXP_COMMIT:-}"
            exp_games="${IN_EXP_GAMES:-}"
            exp_shards="${IN_EXP_SHARDS:-}"
          else
            if [ ! -f "$req" ]; then
              # push の paths フィルタは削除にも一致する。計測後に $req を消す
              # commit は後片付けの正常系なので、赤い run を残さず全部スキップ
              echo "リクエストファイルが削除された push（後片付け）なので何もしない"
              {
                echo "skip=true"
                echo "arena_run_id="
                echo 'opponents=[""]'
                echo "origin_weights="
                echo "adj_share=0.5"
                echo "bootstrap=500"
                echo "expect_candidate="
                echo "expect_match_seed="
                echo "expect_commit="
                echo "expect_games="
                echo "expect_shards="
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            run_id=$(jq -r '.arena_run_id // ""' "$req")
            opponents=$(jq -r 'if (.opponents | type) == "array" then (.opponents | join(" ")) else (.opponents // "estimator_v13 estimator_v14") end' "$req")
            weights=$(jq -r '.origin_weights // ""' "$req")
            adj=$(jq -r '.adj_share // 0.5' "$req")
            boot=$(jq -r '.bootstrap // 500' "$req")
            exp_cand=$(jq -r 'if has("expect_candidate") then .expect_candidate else "estimator" end' "$req")
            exp_seed=$(jq -r '.expect_match_seed // ""' "$req")
            exp_commit=$(jq -r '.expect_commit // ""' "$req")
            exp_games=$(jq -r '.expect_games // ""' "$req")
            exp_shards=$(jq -r '.expect_shards // ""' "$req")
          fi
          # 記録元が無い（リポジトリの records/ を使う）ときは1ジョブだけ回す
          if [ -z "$run_id" ]; then
            opponents=""
          fi
          {
            echo "skip=false"
            echo "arena_run_id=$run_id"
            echo "opponents=$(jq -n -c --arg s "$opponents" 'if $s == "" then [""] else ($s | split(" ") | map(select(. != ""))) end')"
            echo "origin_weights=$weights"
            echo "adj_share=$adj"
            echo "bootstrap=$boot"
            echo "expect_candidate=$exp_cand"
            echo "expect_match_seed=$exp_seed"
            echo "expect_commit=$exp_commit"
            echo "expect_games=$exp_games"
            echo "expect_shards=$exp_shards"
          } >> "$GITHUB_OUTPUT"

  prep:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        opponent: ${{ fromJSON(needs.plan.outputs.opponents) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download arena records
        if: needs.plan.outputs.arena_run_id != ''
        uses: actions/download-artifact@v7
        with:
          pattern: arena-records-${{ matrix.opponent }}-*
          path: records-in
          run-id: ${{ needs.plan.outputs.arena_run_id }}
          github-token: ${{ github.token }}
      # **記録だけでは実験条件を検査できない**（記録の match/end にあるのは戦略名と
      # 相手名だけ）。同じ run の `arena-result-*`（`arena-summary.json` =
      # 実効設定の指紋・局数・時計・予算・match_seed_base、`arena-games.jsonl` = commit）と
      # `arena-combined`（全シャード合算の局数）も取って照合する
      - name: Download arena summaries
        if: needs.plan.outputs.arena_run_id != ''
        uses: actions/download-artifact@v7
        with:
          pattern: arena-result-${{ matrix.opponent }}-*
          path: summaries-in
          run-id: ${{ needs.plan.outputs.arena_run_id }}
          github-token: ${{ github.token }}
      # **必須**（PR #35 レビュー2巡目 [P2]）: シャード番号の連続性だけでは
      # **末尾**の欠落（`{0,1,2}` は 0..n-1 に見える）を拾えない。合算局数との
      # 照合が唯一の fail-closed な検査なので、取れなければ止める
      - name: Download arena combined
        if: needs.plan.outputs.arena_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: arena-combined
          path: combined-in
          run-id: ${{ needs.plan.outputs.arena_run_id }}
          github-token: ${{ github.token }}
      # 関門の中身は `scripts/ci/verify_arena_provenance.sh` に一本化してある
      # （`check-belief.yml`（issue #36）と**同じ検査**を通すため。ワークフローごとに
      # 書くと片方だけ緩くなる）
      - name: Verify arena provenance
        if: needs.plan.outputs.arena_run_id != ''
        env:
          OPPONENT: ${{ matrix.opponent }}
          RUN_ID: ${{ needs.plan.outputs.arena_run_id }}
          GH_TOKEN: ${{ github.token }}
          EXPECT_CANDIDATE: ${{ needs.plan.outputs.expect_candidate }}
          EXPECT_MATCH_SEED: ${{ needs.plan.outputs.expect_match_seed }}
          EXPECT_COMMIT: ${{ needs.plan.outputs.expect_commit }}
          EXPECT_GAMES: ${{ needs.plan.outputs.expect_games }}
          EXPECT_SHARDS: ${{ needs.plan.outputs.expect_shards }}
        run: bash scripts/ci/verify_arena_provenance.sh
      - name: P0-1 / P0-2
        run: |
          set -euo pipefail
          # **artifact が落ちてこなかったときに records/（人対局）へ黙って落ちない**。
          # 相手ごとのラベルの下で別の母集団を報告してしまう
          run_id='${{ needs.plan.outputs.arena_run_id }}'
          if [ -n "$run_id" ]; then
            src=records-in
            if [ -z "$(find "$src" -name '*.jsonl' 2>/dev/null | head -1)" ]; then
              echo "run $run_id から相手 '${{ matrix.opponent }}' の記録を取得できませんでした（artifact 名を確認）" >&2
              exit 1
            fi
          else
            src=records
          fi
          files=$(find "$src" -name '*.jsonl' | sort)
          if [ -z "$files" ]; then
            echo "記録が1つも見つかりません" >&2
            exit 1
          fi
          echo "記録 $(echo "$files" | wc -l) 局（相手 ${{ matrix.opponent }}）"
          opp='${{ matrix.opponent }}'
          # 記録の相手を二重に検査する（artifact のパターンだけに頼らない）
          [ -n "$opp" ] && set -- --opponent "$opp" || set --
          w='${{ needs.plan.outputs.origin_weights }}'
          [ -n "$w" ] && set -- "$@" --origin-weights "$w" || true
          cargo run --release --bin analyze -- $files > analyze-full.txt
          # **P0-1 の集計行だけを拾う**（局ごとの明細が大半）。
          # analyze に集計行を足したら arena.yml / check-economy.yml の
          # フィルタも直すこと
          grep -E "^(--- 被王手の前の準備|  玉の手で王手を解消した手番|  \(a\) |  \(b\) |  \(c\) |  人間の王手|  bot の王手|  寄与量)" \
            analyze-full.txt > check-prep-p01.txt || true
          cat check-prep-p01.txt
          cargo run --release --bin check_prep_probe -- "$@" \
            --adj-share '${{ needs.plan.outputs.adj_share }}' \
            --bootstrap '${{ needs.plan.outputs.bootstrap }}' \
            --out "check-prep-${{ matrix.opponent }}.csv" \
            $files | tee "check-prep-p02.txt"
          {
            echo "## P0-1 連続王手の起点（相手 ${{ matrix.opponent }}）"
            echo '```'
            cat check-prep-p01.txt
            echo '```'
            echo "## P0-2 較正プローブ（相手 ${{ matrix.opponent }}）"
            echo '```'
            cat check-prep-p02.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: check-prep-${{ matrix.opponent }}
          path: |
            check-prep-p01.txt
            check-prep-p02.txt
            check-prep-${{ matrix.opponent }}.csv
            provenance.env
            analyze-full.txt
          if-no-files-found: warn
