name: Scenario Suite

# scenario suite をシードシャードで並列実行する（2026-08-08 に方式変更）。
#
# 旧方式（1シナリオ=1ランナー）は、同一棋譜のシナリオ群でも各ランナーが
# ゼロから prewarm するため、全件 suite で計30時間・壁時計4時間かかっていた
# （支配コストは思考でなく prewarm = 棋譜の再生。127件が同じ棋譜なのに
# 20シード×Σply≒18万局面更新の9割が重複）。
# 新方式は 1シード=1ランナー: 各ランナーが `suite 1 --seed-base <シード>` で
# 全シナリオを1試行ずつ回し、ランナー内では batch のチェーン共有
# （同一棋譜×同一手番は prewarm を ply 昇順で継ぎ足し、fouls= 注入の尾は
# スナップショット側だけに食わせる）とグループ並列（コア数まで）が効く。
# aggregate は `scenario merge` で TRIAL 行を合算する（集計の意味論は
# ChoiceStats を共有するので suite と完全一致）。
# シード・試行数は旧方式と同一なので統計的には等価。
#
# 手動起動のみ。
on:
  workflow_dispatch:
    inputs:
      trials:
        description: "シナリオごとの試行数（= シードシャード数。シード 0..N-1）"
        required: false
        default: "20"
      strategy:
        description: "戦略"
        required: false
        default: "estimator"
      scenarios:
        description: "対象シナリオ（スペース区切り。空なら scenarios/*.kif 全部）"
        required: false
        default: ""
      env:
        description: "評価ノブ（スペース区切りの TSUITATE_XXX=値。arena.yml と同じ形式）"
        required: false
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seeds: ${{ steps.list.outputs.seeds }}
    steps:
      - id: list
        run: |
          trials='${{ inputs.trials }}'
          echo "seeds=$(jq -c -n --argjson n "${trials:-20}" '[range(0; $n)]')" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run suite shard
        env:
          SCENARIO_EXTRA_ENV: ${{ inputs.env }}
          SCENARIO_ONLY: ${{ inputs.scenarios }}
        run: |
          # 評価ノブ（TSUITATE_* のみ許可）。arena.yml と同じ規約
          for kv in $SCENARIO_EXTRA_ENV; do
            case "$kv" in
              TSUITATE_*=*) export "$kv" ;;
              *) echo "無視（TSUITATE_XXX=値 のみ許可）: ${kv}" ;;
            esac
          done
          only_args=()
          if [ -n "$SCENARIO_ONLY" ]; then
            only_args=(--only "$SCENARIO_ONLY")
          fi
          cargo run --release --bin scenario -- \
            suite 1 "${{ inputs.strategy }}" \
            --seed-base "${{ matrix.seed }}" --tsv "${only_args[@]}" \
            | tee result.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo '```'
            grep -v '^TRIAL' result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-shard-s${{ matrix.seed }}
          path: result.txt

  aggregate:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          pattern: scenario-shard-*
          path: results

      - name: Aggregate
        run: |
          cargo run --release --bin scenario -- merge results/*/result.txt | tee merged.md
          {
            echo "## Scenario Suite（各 ${{ inputs.trials }} 試行 / 戦略 ${{ inputs.strategy }} / env '${{ inputs.env }}'）"
            echo ""
            cat merged.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined result
        uses: actions/upload-artifact@v4
        with:
          name: scenario-combined
          path: |
            merged.md
            results/*/result.txt
