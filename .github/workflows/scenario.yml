name: Scenario Suite

# scenario suite をシードシャードで並列実行する（2026-08-08 に方式変更）。
#
# 旧方式（1シナリオ=1ランナー）は、同一棋譜のシナリオ群でも各ランナーが
# ゼロから prewarm するため、全件 suite で計30時間・壁時計4時間かかっていた
# （支配コストは思考でなく prewarm = 棋譜の再生。127件が同じ棋譜なのに
# 20シード×Σply≒18万局面更新の9割が重複）。
# 新方式は 1シード=1ランナー: 各ランナーが `suite 1 --seed-base <シード>` で
# 全シナリオを1試行ずつ回し、ランナー内では batch のチェーン共有
# （同一棋譜×同一手番は prewarm を ply 昇順で継ぎ足し、fouls= 注入の尾は
# スナップショット側だけに食わせる）とグループ並列（コア数まで）が効く。
# aggregate は `scenario merge` で TRIAL 行を合算する（集計の意味論は
# ChoiceStats を共有するので suite と完全一致）。
# シード・試行数は旧方式と同一なので統計的には等価。
#
# 起動は次の2通り（通常のコード push では走らない）:
#   1. Actions UI / `gh workflow run` の手動起動（workflow_dispatch）
#   2. `.github/ci/scenario.request.json` を含む push（エージェントが gh 無しで回す用）
on:
  workflow_dispatch:
    inputs:
      trials:
        description: "シナリオごとの試行数（= シードシャード数。シード 0..N-1）"
        required: false
        default: "20"
      strategy:
        description: "戦略"
        required: false
        default: "estimator"
      scenarios:
        description: "対象シナリオ（スペース区切り。空なら scenarios/*.kif 全部）"
        required: false
        default: ""
      env:
        description: "評価ノブ（スペース区切りの TSUITATE_XXX=値。arena.yml と同じ形式）"
        required: false
        default: ""
  push:
    paths:
      - ".github/ci/scenario.request.json"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.list.outputs.skip }}
      seeds: ${{ steps.list.outputs.seeds }}
      trials: ${{ steps.list.outputs.trials }}
      strategy: ${{ steps.list.outputs.strategy }}
      scenarios: ${{ steps.list.outputs.scenarios }}
      env: ${{ steps.list.outputs.env }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_TRIALS: ${{ github.event.inputs.trials }}
          IN_STRATEGY: ${{ github.event.inputs.strategy }}
          IN_SCENARIOS: ${{ github.event.inputs.scenarios }}
          IN_ENV: ${{ github.event.inputs.env }}
        run: |
          set -euo pipefail
          req='.github/ci/scenario.request.json'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            trials="${IN_TRIALS:-20}"
            strategy="${IN_STRATEGY:-estimator}"
            scenarios="${IN_SCENARIOS:-}"
            extra_env="${IN_ENV:-}"
          else
            if [ ! -f "$req" ]; then
              # push の paths フィルタはファイルの削除にも一致するので、計測が
              # 終わって $req を消す commit でもこのワークフローが起動する。
              # 異常ではなく後片付けの正常系なので、赤い run を残さず全ジョブを
              # スキップする（後続は if: needs.plan.outputs.skip != 'true'）。
              echo "リクエストファイルが削除された push（後片付け）なので何もしない"
              {
                echo "skip=true"
                # 後続ジョブは if: で止まるが、matrix の fromJSON が空文字で
                # 落ちないよう妥当な形の既定値も置いておく（値は使われない）
                echo "seeds=[0]"
                echo "trials=0"
                echo "strategy=estimator"
                echo "scenarios="
                echo "env="
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            trials=$(jq -r '.trials // 20' "$req")
            strategy=$(jq -r '.strategy // "estimator"' "$req")
            scenarios=$(jq -r '
              if (.scenarios | type) == "array" then .scenarios | join(" ")
              else .scenarios // ""
              end
            ' "$req")
            extra_env=$(jq -r '.env // ""' "$req")
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "起動: event=$EVENT_NAME trials=$trials strategy=$strategy scenarios=$scenarios env=$extra_env"
          echo "seeds=$(jq -c -n --argjson n "${trials}" '[range(0; $n)]')" >> "$GITHUB_OUTPUT"
          echo "trials=$trials" >> "$GITHUB_OUTPUT"
          echo "strategy=$strategy" >> "$GITHUB_OUTPUT"
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          {
            echo "env<<EOF"
            echo "$extra_env"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run suite shard
        env:
          SCENARIO_EXTRA_ENV: ${{ needs.plan.outputs.env }}
          SCENARIO_ONLY: ${{ needs.plan.outputs.scenarios }}
        run: |
          set -euo pipefail
          # 評価ノブ（TSUITATE_* のみ許可）。arena.yml と同じ規約
          for kv in $SCENARIO_EXTRA_ENV; do
            case "$kv" in
              TSUITATE_*=*) export "$kv" ;;
              *) echo "無視（TSUITATE_XXX=値 のみ許可）: ${kv}" ;;
            esac
          done
          only_args=()
          if [ -n "$SCENARIO_ONLY" ]; then
            only_args=(--only "$SCENARIO_ONLY")
          fi
          cargo run --release --bin scenario -- \
            suite 1 "${{ needs.plan.outputs.strategy }}" \
            --seed-base "${{ matrix.seed }}" --tsv "${only_args[@]}" \
            | tee result.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo '```'
            grep -v '^TRIAL' result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scenario-shard-s${{ matrix.seed }}
          path: result.txt

  aggregate:
    needs: [plan, shard]
    # always() は skip した shard も待って走るので、skip 条件を明示しないと
    # 「artifact が1つもありません」で赤くなる
    if: always() && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v7
        with:
          pattern: scenario-shard-*
          path: results

      - name: Aggregate
        run: |
          set -euo pipefail
          # download-artifact は v5 以降、pattern の一致が1件だけだと
          # artifact 名のサブディレクトリを作らず path 直下へ展開する
          # （trials=1 のとき）。両方の配置を拾うため ** で辿る。
          shopt -s nullglob globstar
          parts=(results/**/result.txt)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "scenario-shard-* の artifact が1つもありません（全シャードが失敗？）" >&2
            exit 1
          fi
          cargo run --release --bin scenario -- merge "${parts[@]}" | tee merged.md
          {
            echo "## Scenario Suite（各 ${{ needs.plan.outputs.trials }} 試行 / 戦略 ${{ needs.plan.outputs.strategy }} / env '${{ needs.plan.outputs.env }}'）"
            echo ""
            cat merged.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined result
        uses: actions/upload-artifact@v6
        with:
          name: scenario-combined
          path: |
            merged.md
            results/
