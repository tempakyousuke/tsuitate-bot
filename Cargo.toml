[package]
name = "tsuitate-bot"
version = "0.1.0"
edition = "2024"
description = "王様のかくれんぼ用の外部bot（Socket.IOクライアント）"

[features]
# 利き走査の呼び出し回数を数える（src/effect_profile.rs、bin/effect_cost）。
# 既定オフ = カウンタの命令自体がコンパイルされないので通常ビルドは無影響
effect-profile = []

[dependencies]
rust_socketio = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tiny_http = "0.12.0"
hmac = "0.13.0"
sha2 = "0.11.0"

# ビルド時のソース指紋（build.rs）。issue #24 の replicate 検査で、
# 「この CSV を作ったバイナリのコード版」をバイナリへ焼き込むために使う
[build-dependencies]
sha2 = "0.11.0"
